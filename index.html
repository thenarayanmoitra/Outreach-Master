document.addEventListener('DOMContentLoaded', boot);
async function boot(){
  if(CONFIGURED && sbClient && REQUIRE_LOGIN){
    let session = null;
    try{ session = (await sbClient.auth.getSession()).data.session; }catch(e){ console.error(e); }
    if(!session){ renderAuth(); return; }
    state.user = session.user;
    sbClient.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') location.reload(); });
  }
  $('#authHost').innerHTML = '';
  $('#app').hidden = false;
  renderSide();
  $('#view').innerHTML = `<div class="skeleton" style="height:34px;width:260px;margin-bottom:1.4rem"></div><div class="grid g-4">${'<div class="skeleton" style="height:118px"></div>'.repeat(4)}</div>`;
  try{ await loadCore(); }
  catch(e){ console.error(e); state.loadError = e; }
  if(db.hasLedger && !state.loadError){
    db.migrationStatus().then(s=>{ state.legacy = s && s.legacy ? s : null; renderBanners(); }).catch(err=> console.warn('migration_status', err));
  }
  window.addEventListener('hashchange', route);
  route();
}
function renderAuth(){
  $('#app').hidden = true;
  $('#authHost').innerHTML = `<div class="auth"><div class="auth-card">
    <div class="brand" style="padding:0;margin-bottom:.3rem"><span class="brand-word">reach</span><span class="brand-dot"></span></div>
    <p class="muted" style="margin:0 0 1.4rem;font-size:.88rem">Your outreach memory is locked to your account. Sign in to continue.</p>

    <button class="btn btn-primary btn-block" id="authGo">Sign in</button>
    <button class="btn btn-quiet btn-block" id="authLink" style="margin-top:.4rem">Email me a sign-in link instead</button>

  const msg = t=>{ $('#authMsg').textContent = t; };

    const email = $('#authEmail').value.trim(), password = $('#authPass').value;

    const email = $('#authEmail').value.trim();
    if(!email){ msg('Enter your email first.'); return; }

    if(error) msg(error.message); else { $('#authMsg').style.color='var(--green)'; msg('Check your inbox for the sign-in link.'); }
  });

/* ============================= ROUTER ============================= */
const VIEWS = {
  dashboard:     { label:'Dashboard',     icon:'grid',   render: renderDashboard },
  check:         { label:'Check a list',  icon:'shield', render: renderCheck },
  relationships: { label:'Relationships', icon:'users',  render: renderRelationships },
  campaigns:     { label:'Campaigns',     icon:'send',   render: renderCampaigns },
  ledger:        { label:'Ledger',        icon:'book',   render: renderLedger },
  settings:      { label:'Settings',      icon:'gear',   render: renderSettings },
  migrate:       { label:'Migration',     icon:'db',     render: renderMigration, hidden:true },
};
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const [view, id] = h.split('/');
  return { view: VIEWS[view] ? view : 'dashboard', id: id ? decodeURIComponent(id) : null };
}
function go(view, id){
  const h = '#/'+view+(id?'/'+encodeURIComponent(id):'');
  if(location.hash===h) route(); else location.hash = h;
}
function route(){
  state.route = parseHash();
  hideTip();
  renderSide();
  renderBanners();
  const root = $('#view');
  if(state.loadError){ renderLoadError(root); return; }
  VIEWS[state.route.view].render(root);
  window.scrollTo({ top:0 });
}
function rerender(){ if(!state.loadError) VIEWS[state.route.view].render($('#view')); }
function renderLoadError(root){
  const schemaMissing = /schema|Run schema/.test(friendlyError(state.loadError));
  root.innerHTML = `<div class="card reveal" style="max-width:720px;margin:4vh auto 0;padding:2rem 2.2rem">
    <div class="eyebrow mono">${schemaMissing?'One step left':'Could not load'}</div>
    <h1 style="font-size:1.6rem;margin-bottom:.6rem">${schemaMissing?'Update your Supabase database':'Reach could not reach the database'}</h1>
    ${schemaMissing?`<p class="lede" style="margin-bottom:1rem">This version of Reach splits your data into relationships, a sent ledger, campaign sends and a bounce suppression list. Your Supabase project doesn't have those tables yet.</p>
      <ol style="color:var(--text-2);line-height:1.8;padding-left:1.2rem;margin:0 0 1.2rem">
        <li>Open your Supabase project → <b>SQL Editor</b> → New query.</li>
        <li>Paste all of <code>schema.sql</code> (shipped next to this file) and run it. It never touches your old <code>leads</code> table.</li>
        <li>Reload this page, then go to <b>Settings → Migrate</b> to move your old leads across.</li>
      </ol>`:`<p class="lede" style="margin-bottom:1rem">${esc(friendlyError(state.loadError))}</p>`}
    <button class="btn btn-primary" onclick="location.reload()">${icon('repeat')} Reload</button>
  </div>`;
}

    if(key==='campaigns' && state.loaded) count = fmtN(state.campaigns.length);

  };
  $('#side').innerHTML = `
    <div><div class="brand"><span class="brand-word">reach</span><span class="brand-dot"></span></div>
    <div class="brand-tag mono">outreach memory</div></div>
    <div class="side-actions">
      <button class="btn btn-accent btn-side" data-act="check" title="Check a list (C)">${icon('shield')}<span>Check a list</span></button>
      <button class="btn btn-side" data-act="reply" title="Log a reply (R)">${icon('reply')}<span>Log reply</span></button>

    <nav class="side-nav">
      <div class="nav-label mono">Workspace</div>
      ${nav('dashboard')}${nav('check')}${nav('relationships')}${nav('campaigns')}
      <div class="nav-label mono">Memory</div>
      ${nav('ledger')}${nav('settings')}

    <div class="side-foot">
      <div class="conn ${db.mode==='local'?'local':''}"><i></i>${db.mode==='local'?'Local mode · this browser only':'Connected to Supabase'}</div>
      ${state.user?`<div class="conn" style="padding-left:.55rem"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(state.user.email||'')}</span></div>`:''}
      <div class="kbd-hint"><kbd>C</kbd> check · <kbd>R</kbd> reply · <kbd>/</kbd> search</div>
    </div>`;
  $$('#side [data-nav]').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.nav)));
  $('#side [data-act="check"]').addEventListener('click', ()=> go('check'));

function renderBanners(){
  const host = $('#banners'); if(!host) return;
  const parts = [];
  if(db.mode==='local'){
    parts.push(`<div class="banner warn">${icon('info')}<span><b>Local mode.</b> Relationships and campaigns live in this browser only. Ledger checks, Mark as Sent and bounce purges need the database connection — set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> in index.html.</span></div>`);
  }
  if(state.legacy && state.route.view!=='migrate'){
    parts.push(`<div class="banner info">${icon('db')}<span><b>Your old leads table is still here</b> — ${fmtN(state.legacy.total)} rows. Move it into relationships and the sent ledger so Reach stops loading everything on open.</span><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-go-migrate>Start migration ${icon('arrowR','ic-sm')}</button></div>`);
  }
  host.innerHTML = parts.join('');
  host.querySelector('[data-go-migrate]')?.addEventListener('click', ()=> go('migrate'));
}

/* Keyboard: C check, R log reply, / search. Never while typing. */
document.addEventListener('keydown', e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if(t && (t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName))) return;
  if(modalStack.length || $('#progressHost').innerHTML || $('#app').hidden) return;
  if(e.key==='/'){ const s = $('#view .search input'); if(s){ e.preventDefault(); s.focus(); } }
  else if(e.key==='c' || e.key==='C'){ e.preventDefault(); go('check'); }
  else if(e.key==='r' || e.key==='R'){ e.preventDefault(); openLogReply(); }
});

/* ============================= DASHBOARD (spec 8) ============================= */
async function getStats(force){
  if(!db.hasLedger) return null;
  if(!force && state.stats && Date.now()-state.statsAt < 30000) return state.stats;
  state.stats = await db.dashboardStats();
  state.statsAt = Date.now();
  return state.stats;
}
function relStatsLocal(){
  const by = {}; STATUSES.forEach(s=> by[s]=0);
  for(const r of state.rels) by[r.status] = (by[r.status]||0)+1;
  const converted = new Set(), pool = new Set();
  for(const n of state.notes){
    if(!n.auto) continue;
    if(n.note==='Status changed from In Conversation to Active Client') converted.add(n.relationship_id);
    if(n.note.startsWith('Status changed from In Conversation to ')) pool.add(n.relationship_id);
  }
  for(const r of state.rels) if(r.status==='In Conversation') pool.add(r.id);
  return { by, converted: converted.size, pool: pool.size };
}
function dueItems(){
  const soon = addDaysISO(7), today = todayISO(), items = [];
  for(const r of state.rels){
    if(r.next_follow_up && String(r.next_follow_up).slice(0,10) <= soon) items.push({ r, kind:'Follow up', date:String(r.next_follow_up).slice(0,10) });
    if(r.revisit_after){ const d = String(r.revisit_after).slice(0,10); if(d>=today && d<=soon) items.push({ r, kind:'Revisit', date:d }); }
  }
  return items.sort((a,b)=> a.date.localeCompare(b.date));
}
function goingCold(){
  const cutoff = addDaysISO(-21);
  return state.rels.filter(r=> r.status==='In Conversation' && String(r.last_contacted || r.replied_at || r.created_at || '').slice(0,10) < cutoff)
    .sort((a,b)=> String(a.last_contacted||a.replied_at||'').localeCompare(String(b.last_contacted||b.replied_at||'')));
}

/* ============================= CHECK (spec 3.1) =============================
   Checking a list never writes anything. Upload → map → normalise → collapse
   in-file duplicates → Tier 1 against relationships in the browser → one
   server round trip per 500 addresses against the ledger and suppression →
   one label per row → review → export. Mark as Sent is a separate action. */
let check = null;
function newCheck(){
  return { stage:'upload', files:[], rows:[], listName:'', collapsed:0, collapsedList:[], multiSplit:0, emptyRows:0,
    filter:'all', q:'', limit:200, ledgerChecked:false, ledgerError:null, domainNotes:0,
    reachCols: lsJson('reach_reach_cols_v2', true), lastExport:null, extraHeaders:[], markedCampaign:null };
}
const CHECK_FIELDS = [
  { key:'company', label:'Company', hints:['company','organisation','organization','business','account','agency','firm'] },
  { key:'contact', label:'Contact name', hints:['contact','poc','person','full name','first name','name'] },
  { key:'email',   label:'Email', hints:['email','e-mail','mail'] },
];
function headerSignature(h){ return h.map(x=>String(x).toLowerCase().trim()).sort().join('|'); }
function guessMapping(headers){
  const map = {}, used = new Set();
  // email first: a "Contact Email" column must not be claimed as the contact name.
  for(const f of [CHECK_FIELDS[2], CHECK_FIELDS[0], CHECK_FIELDS[1]]){
    let found = '';
    for(const h of headers){ if(used.has(h)) continue; const hl = h.toLowerCase(); if(f.hints.some(x=>hl.includes(x))){ found = h; break; } }
    if(found) used.add(found);
    map[f.key] = found;
  }
  map.extras = [];
  return map;
}

function renderCheck(root){
  if(!check) check = newCheck();
  if(check.stage==='review') return renderCheckReview(root);
  root.innerHTML = `
    ${pageHead({ eyebrow:'Check', title:'Check a list before you send it', lede:'Upload one or more sheets from Google Sheets. Reach checks every address against your relationships and everyone you have ever mailed, then hands back a clean send list. <b>Checking never writes anything.</b>' })}
    ${checkSteps(1)}
    ${db.hasLedger?'':needsDbNotice('The ledger part of the check')}
    <div class="dropzone reveal" id="dz" tabindex="0" role="button" aria-label="Upload files">
      <div class="empty-art">${icon('upload')}</div>
      <h3>Drop .xlsx or .csv files here</h3>
      <p>or click to browse — several files at once are checked as one list</p>
      <input type="file" id="fi" accept=".xlsx,.xls,.csv" multiple hidden>
    </div>
    <div class="or-sep">or paste addresses</div>
    <div class="card reveal">
      <textarea class="textarea" id="pasteBox" placeholder="One per line, or a whole column copied from a sheet. &quot;Jane Doe <jane@acme.com>&quot; keeps the name." style="min-height:120px"></textarea>
      <div class="inline" style="justify-content:flex-end;margin-top:.7rem"><span class="muted small" id="pasteCount"></span><button class="btn btn-primary btn-sm" id="pasteGo" disabled>Check pasted list</button></div>
    </div>
    <div class="how reveal">
      <div class="how-item"><span class="how-num">1</span><div><b>Relationships first</b>Exact email, then company, domain and contact name against everyone who ever replied.</div></div>
      <div class="how-item"><span class="how-num">2</span><div><b>Then the ledger</b>Addresses you already mailed, and anything that ever bounced, checked on the server in batches.</div></div>
      <div class="how-item"><span class="how-num">3</span><div><b>Export, send, mark</b>Download the clean list, send it from your tool, then Mark as Sent to record the campaign.</div></div>
    </div>`;
  const dz = $('#dz'), fi = $('#fi');
  dz.addEventListener('click', ()=> fi.click());
  dz.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fi.click(); } });
  fi.addEventListener('change', ()=> checkReadFiles(fi.files));
  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e=> checkReadFiles(e.dataTransfer.files));
  const pb = $('#pasteBox');
  pb.addEventListener('input', debounce(()=>{
    const n = extractEmails(pb.value).valid.length;
    $('#pasteCount').textContent = n ? `${plural(n,'address','addresses')} found` : '';
    $('#pasteGo').disabled = !pb.value.trim();
  }, 150));
  $('#pasteGo').addEventListener('click', ()=> checkFromPaste(pb.value));
}
function checkSteps(n){
  const s = ['Upload','Map columns','Review & export','Mark as sent'];
  return `<div class="steps reveal">${s.map((t,i)=>`${i?'<span class="step-sep"></span>':''}<span class="step ${i+1<n?'done':i+1===n?'now':''}"><i>${i+1<n?'✓':i+1}</i>${t}</span>`).join('')}</div>`;
}
/* Lines like "Jane Doe <jane@acme.com>" keep the name; everything else is
   just an address. */
function parsePastedLines(text){
  const rows = [];
  for(const line of String(text||'').split(/\r?\n/)){
    const tokens = line.match(EMAILISH_RE) || [];
    if(!tokens.length){ if(line.trim()) rows.push(['', line.trim()]); continue; }
    for(const t of tokens){
      const before = line.slice(0, line.indexOf(t)).replace(/[<>"'(),;:]/g,' ').replace(/mailto/i,'').trim();
      const name = tokens.length===1 && before && !before.includes('@') && before.length<60 ? before : '';
      rows.push([name, t.replace(/\.+$/,'')]);
    }
  }
  return rows;
}
function checkFromPaste(text){
  const rows = parsePastedLines(text);
  if(!rows.length){ toast('Nothing to check.','warn'); return; }
  check = newCheck();
  check.listName = 'Pasted list';
  check.files = [{ name:'Pasted list', headers:['Name','Email'], dataRows:rows, mapping:{ company:'', contact:'Name', email:'Email', extras:[] } }];
  runCheck();
}
async function checkReadFiles(fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  check = newCheck();
  const p = startProgress([{key:'read',label:'Read'}]);
  p.step('read','Reading your files', plural(files.length,'file')+' to unpack.', files.length);
  try{
    for(const file of files){
      p.note(file.name); await yieldToPaint();
      try{
        const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'', raw:false });
        if(rows.length){
          const headers = rows[0].map((h,i)=> String(h||'').trim() || `Column ${i+1}`);
          const dataRows = rows.slice(1).filter(r=> r.some(c=> String(c||'').trim()!==''));
          check.files.push({ name:file.name.replace(/\.[^.]+$/,''), headers, dataRows });
        }
      }catch(e){ console.error(e); toast(`Could not read ${file.name}`,'err'); }
      p.tick();
    }
  } finally { p.close(); }
  if(!check.files.length){ toast('Nothing readable in those files.','warn'); return; }
  check.listName = check.files.length===1 ? check.files[0].name : `${check.files[0].name} +${check.files.length-1}`;
  mapNextFile();
}
function mapNextFile(){
  const f = check.files.find(x=>!x.mapping);
  if(!f){ runCheck(); return; }
  const sig = headerSignature(f.headers);
  const remembered = state.columnMaps[sig];
  if(remembered && (remembered.email || remembered.company || remembered.contact)){ f.mapping = { extras:[], ...remembered }; mapNextFile(); return; }
  const guess = guessMapping(f.headers);
  const sample = h=>{ const i = f.headers.indexOf(h); if(i<0) return ''; return f.dataRows.slice(0,4).map(r=>String(r[i]||'').trim()).filter(Boolean).slice(0,2).join(' · '); };
  const idx = check.files.indexOf(f);
  const el = openModal({ title:'Map columns', eyebrow:`File ${idx+1} of ${check.files.length}`, size:'lg',
    sub:`<b>${esc(f.name)}</b> · ${plural(f.dataRows.length,'row')}. Remembered for every file with the same headers.`,
    body:`<div class="map-grid">${CHECK_FIELDS.map(fd=>`<div class="field"><label>${fd.label}${fd.key==='email'?' (needed to check)':''}</label>
        <select class="select" data-map="${fd.key}"><option value="">— None —</option>${f.headers.map(h=>`<option ${guess[fd.key]===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
        <div class="sample" data-sample="${fd.key}">${esc(sample(guess[fd.key]))}</div></div>`).join('')}</div>
      <div class="field" style="margin-top:.4rem"><label>Carry these columns through to the clean export</label>
        <div class="extra-cols" id="extraCols">${f.headers.map(h=>`<label><input type="checkbox" value="${esc(h)}">${esc(h)}</label>`).join('')}</div>
        <div class="field-hint">Optional. Picked columns appear after Company, Contact Name and Email, in this order.</div></div>`,
    foot:`<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" data-ok>${idx+1<check.files.length?'Next file':'Run the check'} ${icon('arrowR','ic-sm')}</button>` });
  const syncExtras = ()=>{
    const used = new Set($$('[data-map]', el).map(s=>s.value).filter(Boolean));
    $$('#extraCols input', el).forEach(cb=>{ const lab = cb.parentElement; lab.hidden = used.has(cb.value); if(lab.hidden) cb.checked=false; });
  };
  $$('[data-map]', el).forEach(s=> s.addEventListener('change', ()=>{ $(`[data-sample="${s.dataset.map}"]`, el).textContent = sample(s.value); syncExtras(); }));
  syncExtras();
  el.querySelector('[data-cancel]').addEventListener('click', ()=>{ check = newCheck(); closeModal(el); });
  el.querySelector('[data-ok]').addEventListener('click', ()=>{
    const m = { extras: $$('#extraCols input:checked', el).map(c=>c.value) };
    $$('[data-map]', el).forEach(s=> m[s.dataset.map] = s.value);
    if(!m.email && !m.company && !m.contact){ toast('Map at least one column.','warn'); return; }
    if(!m.email) toast('No email column — every row will be Invalid.','warn');
    f.mapping = m;
    state.columnMaps[sig] = m; lsPut('reach_column_maps_v2', state.columnMaps);
    closeModal(el);
    mapNextFile();

}

let checkRunning = false;
async function runCheck(){
  if(checkRunning) return;
  checkRunning = true;
  const c = check;
  const steps = [{key:'prep',label:'Normalise'},{key:'rel',label:'Relationships'},{key:'ledger',label:'Ledger'}];
  const p = startProgress(steps);
  try{
    // ---- build + normalise ----
    const extras = [];
    for(const f of c.files) for(const h of (f.mapping.extras||[])) if(!extras.includes(h)) extras.push(h);
    c.extraHeaders = extras;
    const raw = [];
    for(const f of c.files){
      const m = f.mapping, col = h=> h ? f.headers.indexOf(h) : -1;
      const ci = col(m.company), pi = col(m.contact), ei = col(m.email);
      for(const r of f.dataRows){
        const company = ci>-1 ? String(r[ci]??'').trim() : '';
        const contact = pi>-1 ? String(r[pi]??'').trim() : '';
        const cell = ei>-1 ? r[ei] : '';
        const ex = {}; for(const h of (m.extras||[])){ const i = f.headers.indexOf(h); ex[h] = i>-1 ? String(r[i]??'').trim() : ''; }
        const parts = splitEmailCell(cell);
        if(!company && !contact && !parts.length){ c.emptyRows++; continue; }
        if(parts.length>1) c.multiSplit += parts.length-1;
        const base = { company_name:company, contact_person:contact, company_name_clean:cleanCompany(company), extras:ex, file:f.name };
        if(!parts.length) raw.push({ ...base, email_raw:'', email_norm:'', valid:false });
        else for(const part of parts){ const n = normEmail(part); raw.push({ ...base, email_raw:part, email_norm:n.valid?n.email:'', email_domain:n.valid?emailDomain(n.email):'', valid:n.valid }); }
      }
    }
    p.step('prep','Normalising addresses', `${plural(raw.length,'row')} across ${plural(c.files.length,'file')}.`, raw.length);
    // Collapse duplicates inside the upload set, keeping the first.
    const seen = new Map();
    c.rows = [];
    for(let i=0;i<raw.length;i++){
      const r = raw[i];
      if(r.valid){
        const first = seen.get(r.email_norm);
        if(first){ c.collapsed++; c.collapsedList.push({ email:r.email_norm, kept:first, dropped:r }); continue; }
        seen.set(r.email_norm, r);
      }
      r.i = c.rows.length; c.rows.push(r);
      if(i%400===0){ p.set(i); await yieldToPaint(); }
    }
    // ---- Tier 1 in the browser ----
    p.step('rel','Checking relationships', `Against ${plural(state.rels.length,'relationship')} — exact email, company, domain and name.`, c.rows.length);
    const idx = buildRelIndex(state.rels);
    for(let i=0;i<c.rows.length;i++){
      const r = c.rows[i];
      r.matches = r.valid || r.company_name || r.contact_person ? tier1Check(r, idx) : [];
      if(i%250===0){ p.set(i); await yieldToPaint(); }
    }
    // ---- ledger + suppression on the server, 500 per round trip ----
    await checkLedger(c, p);
  } finally {
    checkRunning = false;
    p.close();
  }
  c.stage = 'review';
  if(state.route.view!=='check') go('check'); else rerender();
}
async function checkLedger(c, p){
  c.ledgerChecked = false; c.ledgerError = null; c.domainNotes = 0;
  for(const r of c.rows){ r.ledger = null; r.bounce = null; r.domainNote = false; }
  if(db.hasLedger){
    const emails = c.rows.filter(r=>r.valid).map(r=>r.email_norm);
    const byEmail = new Map(c.rows.filter(r=>r.valid).map(r=>[r.email_norm, r]));
    if(p) p.step('ledger','Checking the sent ledger', `${plural(emails.length,'address','addresses')}, ${CHECK_BATCH} per round trip. Nothing is written.`, emails.length);
    try{
      for(let i=0;i<emails.length;i+=CHECK_BATCH){
        const batch = emails.slice(i, i+CHECK_BATCH);
        const hits = await db.checkEmails(batch);
        for(const h of hits||[]){
          const r = byEmail.get(h.email); if(!r) continue;
          if(h.send_count!=null) r.ledger = { send_count:h.send_count, last_sent_at:h.last_sent_at, last_campaign_name:h.last_campaign_name, replied:h.replied };
          if(h.bounced_at) r.bounce = { bounced_at:h.bounced_at, campaign_name:h.bounce_campaign_name };
        }
        if(p){ p.tick(batch.length); await yieldToPaint(); }
      }
      c.ledgerChecked = true;
      // Optional domain warning (4.4), off by default.
      if(state.settings.domainWarning){
        labelRows(c);
        const doms = [...new Set(c.rows.filter(r=>r.label==='new' && r.email_domain && !FREE_EMAIL_DOMAINS.has(r.email_domain)).map(r=>r.email_domain))];
        const hitSet = new Set();
        for(let i=0;i<doms.length;i+=CHECK_BATCH){ for(const d of await db.checkDomains(doms.slice(i,i+CHECK_BATCH))||[]) hitSet.add(d); }
        for(const r of c.rows) if(r.label==='new' && hitSet.has(r.email_domain)){ r.domainNote = true; c.domainNotes++; }
      }
    }catch(e){ console.error(e); c.ledgerError = friendlyError(e); }
  }
  labelRows(c);
}
/* Exactly one label per row, in priority order: Invalid, Blocked, Warning,
   Previously mailed, New (spec 3.1). */
function labelRows(c){
  for(const r of c.rows){
    const top = r.matches && r.matches[0];
    if(!r.valid) r.label = 'invalid';
    else if(r.bounce || (top && top.outcome==='blocked')) r.label = 'blocked';
    else if(top && top.outcome==='warning') r.label = 'warning';
    else if(r.ledger) r.label = 'prev';
    else r.label = 'new';
    if(r.include===undefined || r.label==='blocked' || r.label==='invalid') r.include = (r.label==='new' || r.label==='prev');
  }
}
function checkCounts(c){
  const n = { all:c.rows.length, new:0, prev:0, warning:0, blocked:0, invalid:0, domain:c.domainNotes };
  for(const r of c.rows) n[r.label]++;
  return n;
}
function exportable(c){ return c.rows.filter(r=> r.include && (r.label==='new' || r.label==='prev' || r.label==='warning')); }
function checkFiltered(c){
  let rows = c.rows;
  if(c.filter==='domain') rows = rows.filter(r=>r.domainNote);
  else if(c.filter!=='all') rows = rows.filter(r=>r.label===c.filter);
  if(c.q){ const q = c.q.toLowerCase(); rows = rows.filter(r=> (r.company_name+' '+r.contact_person+' '+r.email_raw).toLowerCase().includes(q)); }
  return rows;
}

}

    }
  });
}
async function runMarkSent(camp, emails, sentAt){
  const chunks = [];
  for(let i=0;i<emails.length;i+=MARK_CHUNK) chunks.push(emails.slice(i, i+MARK_CHUNK));
  const p = startProgress([{key:'write',label:'Write'},{key:'done',label:'Done'}]);
  p.step('write', `Marking ${plural(emails.length,'address','addresses')} as sent`, `Campaign “${camp.name}”. Each batch is one transaction — safe to retry.`, emails.length);
  const acc = { added:0, already:0, suppressed:0, invalid:0, inserted:[], prev:[], chunksDone:0 };
  // Undo covers exactly what this action inserted, even if it stops halfway.
  state.lastMarkSent = { campaignId:camp.id, campaignName:camp.name, inserted:acc.inserted, prev:acc.prev, at:Date.now(), total:emails.length };
  try{
    for(const ch of chunks){
      const r = await db.markSent(camp.id, ch, sentAt);
      acc.added += r.added||0; acc.already += r.already||0; acc.suppressed += r.suppressed||0; acc.invalid += r.invalid||0;
      acc.inserted.push(...(r.inserted||[])); acc.prev.push(...(r.prev||[]));
      acc.chunksDone++; p.tick(ch.length);
      if(r.sent_count!=null){ const c = campById(camp.id); if(c) c.sent_count = r.sent_count; }
    }
    await p.finish('Marked as sent', `${fmtN(acc.added)} added to ${camp.name}.`, 600);
  }catch(e){
    p.close();
    await reloadCampaigns().catch(()=>{});
    invalidateStats();
    uiConfirm({ title:'Stopped part-way', alert:true, message:`${esc(friendlyError(e))}<br><br>${fmtN(acc.chunksDone)} of ${fmtN(chunks.length)} batches were written and are safe. Running Mark as Sent again with the same list is safe too — nothing is ever counted twice.`, confirmLabel:'OK' });
    return null;
  }
  if(!acc.inserted.length) state.lastMarkSent = null;
  await reloadCampaigns().catch(()=>{});
  invalidateStats();
  return acc;
}
function showMarkSentResult(camp, r){
  const el = openModal({ title:'Recorded', eyebrow:camp.name, size:'sm',
    body:`<div class="grid g-3" style="gap:.6rem">
        <div class="stat-mini"><span class="mono muted">Added</span><b>${fmtN(r.added)}</b></div>
        <div class="stat-mini"><span class="mono muted">Already in it</span><b>${fmtN(r.already)}</b></div>
        <div class="stat-mini"><span class="mono muted">Bounced before</span><b>${fmtN(r.suppressed)}</b></div>
      </div>
      <p class="muted small" style="margin:1rem 0 0">${r.added?`The ledger now remembers these addresses. Wrong campaign? Undo reverses exactly the rows this just inserted.`:`Nothing new — every address was already recorded for this campaign.`}${r.suppressed?' Addresses on the bounce suppression list are never written back.':''}</p>`,
    foot:`${r.added?`<button class="btn btn-danger-ghost" data-undo>${icon('undo')} Undo</button>`:''}<button class="btn btn-ghost" data-view>View campaign</button><button class="btn btn-primary" data-ok>Done</button>` });
  el.querySelector('[data-ok]').addEventListener('click', ()=> closeModal(el));
  el.querySelector('[data-view]').addEventListener('click', ()=>{ closeModal(el); go('campaigns', camp.id); });
  el.querySelector('[data-undo]')?.addEventListener('click', async ()=>{ closeModal(el); await undoLastMarkSent(); });
  if(state.route.view!=='check') rerender();
}
async function undoLastMarkSent(){
  const u = state.lastMarkSent; if(!u) return;
  if(!(await uiConfirm({ title:'Undo last Mark as Sent?', message:`Removes the ${plural(u.inserted.length,'address','addresses')} that action added to <b>${esc(u.campaignName)}</b> and restores their ledger rows exactly as they were.`, confirmLabel:'Undo', danger:true }))) return;
  const p = startProgress();
  p.step('undo','Undoing', `Reversing ${plural(u.inserted.length,'send')} in ${u.campaignName}.`, u.inserted.length);
  try{
    const prevBy = new Map(u.prev.map(x=>[x.email_norm, x]));
    for(let i=0;i<u.inserted.length;i+=MARK_CHUNK){
      const ch = u.inserted.slice(i, i+MARK_CHUNK);
      await db.undoMarkSent(u.campaignId, ch, ch.map(e=>prevBy.get(e)).filter(Boolean));
      p.tick(ch.length);
    }
    state.lastMarkSent = null;
    if(check && check.markedCampaign===u.campaignName) check.markedCampaign = null;
    await reloadCampaigns(); invalidateStats();
    await p.finish('Undone', 'The ledger is back to how it was.', 500);
    toast(`Undid ${plural(u.inserted.length,'send')} in ${u.campaignName}.`);
    rerender();
  }catch(e){ p.close(); toastErr(e, 'Undo failed — nothing partial was left behind for that batch.'); }
}

/* Every status change goes through here. Declined asks for a revisit date,
   Redirected offers to add the referred person (spec 5.3); the database
   writes the automatic timeline note. */
async function changeStatus(r, status, { revisit, skipReferral=false }={}){
  if(!r || r.status===status) return false;
  const fields = { status };
  if(status==='Declined'){
    const v = revisit!==undefined ? revisit : await askRevisit(r.revisit_after);
    if(v===undefined) return false;
    fields.revisit_after = v;
  }
  try{
    const row = await db.updateRelationship(r.id, fields);
    upsertRelLocal(row);
    await refreshRelNotes(r.id);
    invalidateStats();
    toast(`${relName(row)} → ${status}`);
  }catch(e){ toastErr(e,'Could not change status.'); return false; }
  if(status==='Redirected' && !skipReferral) await openReferral(relById(r.id));
  return true;
}

    el.querySelector('[data-skip]').addEventListener('click', ()=> closeModal(el));
    el.querySelector('[data-ok]').addEventListener('click', async ()=>{
      const ref = refPayload($('#refEmail', el).value, $('#refName', el).value, $('#refCompany', el).value);
      if(!ref){ toast('Add at least an email or a name.','warn'); return; }
      if(ref.email && !normEmail(ref.email).valid){ toast('That email doesn’t look right.','warn'); return; }
      try{
        const r = await db.createReferral(from.id, ref);
        await reloadRelationships(); invalidateStats();
        done = true; closeModal(el); toast('Referral added and linked.'); res(r);
        rerender();
      }catch(e){ toastErr(e,'Could not add the referral.'); }
    });
  });
}
function refPayload(email, name, company){
  const e = normEmail(email||''); const n = (name||'').trim(), c = (company||'').trim();
  if(!e.email && !n && !c) return null;
  return { email: e.valid ? e.email : (email||'').trim(), contact_person:n, company_name:c, company_name_clean: cleanCompany(c) };
}

function renderTimeline(id){
  const notes = notesOf(id);
  if(!notes.length) return `<p class="muted small" style="margin:0">No notes yet.</p>`;
  return `<div class="timeline">${notes.map(n=>{
    const text = esc(n.note).replace(/\s*\[ref:([0-9a-f-]{8,})\]/gi, (m, rid)=> relById(rid) ? ` <a href="#" data-open-rel="${rid}">open ${esc(relById(rid).contact_person || relName(relById(rid)))}</a>` : '');
    return `<div class="tl-item ${n.auto?'auto':''}"><span class="tl-dot"></span><div><div class="tl-date">${fmtDateTime(n.created_at)}${n.auto?' · automatic':''}</div><div class="tl-text">${text}</div></div></div>`; }).join('')}</div>`;
}
function campaignOptions(selected, { none='— None (inbound or referral) —' }={}){
  const camps = state.campaigns.slice().sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
  return `<option value="">${none}</option>${camps.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} · ${fmtDate(c.date)}</option>`).join('')}`;
}

    const n = normEmail(emailRaw);

      const clash = state.rels.find(x=> x.id!==r.id && x.email_norm===n.email);
      if(clash && !(await uiConfirm({ title:'That email belongs to another relationship', message:`<b>${esc(relName(clash))}</b> (${esc(clash.status)}) already uses ${esc(n.email)}. Save anyway?`, confirmLabel:'Save anyway' }))) return;
    }
    const newStatus = $('#dStatus', el).value;
    const fields = { company_name:company, company_name_clean:cleanCompany(company), contact_person:contact, email: n.valid?n.email:emailRaw,
      source_campaign_id: $('#dCamp', el).value || null, replied_at: $('#dReplied', el).value || null, last_contacted: $('#dLast', el).value || null,

    if($('#dBounced', el)) fields.email_bounced = $('#dBounced', el).checked;
    const statusChanged = newStatus!==r.status;
    if(statusChanged) fields.status = newStatus;
    try{
      const row = await db.updateRelationship(r.id, fields);
      upsertRelLocal(row);
      if(statusChanged) await refreshRelNotes(r.id);
      invalidateStats();
      closeModal(el); toast('Saved.');
      if(statusChanged && newStatus==='Redirected') await openReferral(relById(r.id));
      rerender();
    }catch(e){ toastErr(e,'Save failed.'); }
  });
}
function ledgerSummaryHtml(L){
  const l = L.ledger, s = L.suppression;
  const rel = state.rels.find(r=> r.email_norm===L.email);
  return `<div class="inline" style="justify-content:space-between;margin-bottom:.5rem"><b style="font-family:'Space Grotesk',sans-serif;font-size:1.05rem">${esc(L.email||'')}</b>
      <span class="inline">${s?`<span class="lbl lbl-blocked">${icon('ban')}Suppressed</span>`:''}${l?`<span class="lbl lbl-prev">${icon('repeat')}In ledger</span>`:`<span class="lbl lbl-new">${icon('check')}Never mailed</span>`}${l&&l.replied?`<span class="lbl lbl-new">${icon('reply')}Replied</span>`:''}</span></div>
    ${l?`<p class="small" style="margin:.2rem 0 .7rem;color:var(--text-2)">${ledgerLine({ send_count:l.send_count, last_sent_at:l.last_sent_at, last_campaign_name:l.last_campaign_name })}. First mailed ${fmtDate(l.first_sent_at)}${l.first_campaign_name?` in ${esc(l.first_campaign_name)}`:''}.</p>`:''}
    ${(L.sends||[]).length || s ? `<div class="hist">${(L.sends||[]).map(x=>`<div class="hist-item"><b>${esc(x.campaign_name)}</b> <span class="muted">· sent ${fmtDate(x.sent_at)}</span></div>`).join('')}
      ${(L.replies||[]).map(x=>`<div class="hist-item good">Replied to <b>${esc(x.campaign_name)}</b> <span class="muted">· logged ${fmtDate(x.created_at)}</span></div>`).join('')}
      ${s?`<div class="hist-item bad">Bounced${s.campaign_name?` in <b>${esc(s.campaign_name)}</b>`:''} <span class="muted">· ${fmtDate(s.bounced_at)} — blocked from every future export</span></div>`:''}</div>`:''}
    ${rel?`<p class="small" style="margin:.8rem 0 0">Relationship: <a href="#" data-open-rel="${rel.id}">${esc(relName(rel))}</a> ${statusPill(rel.status)}</p>`:''}`;
}

/* ============================= LOG A REPLY (spec 5.1, 5.3, 11) =============================
   Out-of-office replies, auto-responders and delivery receipts are NOT
   replies — those people stay in the ledger only. */
function openLogReply(prefill={}){
  let ledgerInfo = null, userPickedCampaign = false, lookupSeq = 0;
  const el = openModal({ title:'Log a reply', eyebrow:'Promote to relationship', size:'lg',
    sub:'Only real human replies. Out-of-office, auto-responders and delivery receipts stay in the ledger.',
    body:`
      <div class="field"><label>Their email</label><input class="input" id="lrEmail" placeholder="Paste the address that replied" value="${esc(prefill.email||'')}" autofocus autocomplete="off"><div class="field-hint" id="lrEmailHint">&nbsp;</div></div>
      <div id="lrExisting"></div>
      <label class="check" style="margin:-.3rem 0 .9rem"><input type="checkbox" id="lrDiff"> They replied from a different address than the one I mailed</label>
      <div class="field" id="lrLedgerWrap" hidden><label>Address that was mailed</label><input class="input" id="lrLedgerEmail" placeholder="The address in your campaign, for attribution" autocomplete="off"><div class="field-hint">The relationship keeps their new address; the campaign gets credit through the one you mailed.</div></div>
      <div id="lrLedgerInfo"></div>
      <div class="field-row">
        <div class="field"><label>Status</label><select class="select" id="lrStatus">${STATUSES.map(s=>`<option ${s===(prefill.status||'In Conversation')?'selected':''}>${s}</option>`).join('')}</select><div class="field-hint" id="lrStatusHint"></div></div>
        <div class="field"><label>Source campaign</label><select class="select" id="lrCamp">${campaignOptions(prefill.campaign_id||null)}</select></div>
        <div class="field"><label>Contact name</label><input class="input" id="lrName" value="${esc(prefill.contact_person||'')}" placeholder="From their signature"></div>
        <div class="field"><label>Company</label><input class="input" id="lrCompany" value="${esc(prefill.company_name||'')}" placeholder="The ledger never stored this"></div>
        <div class="field"><label>Replied on</label><input class="input" type="date" id="lrDate" value="${todayISO()}"></div>
        <div class="field" id="lrRevisitWrap" hidden><label>Revisit after</label><input class="input" type="date" id="lrRevisit"><div class="quick"><button data-rv="3">3 months</button><button data-rv="6">6 months</button><button data-rv="12">12 months</button><button data-rv="0">never</button></div></div>
      </div>
      <div id="lrMatches"></div>
      <div class="card card-tint" id="lrRefBox" hidden style="margin-bottom:1rem">
        <div class="mono muted" style="margin-bottom:.6rem">The referred person — added as In Conversation, linked both ways</div>
        <div class="field-row-3"><div class="field"><label>Email</label><input class="input" id="lrRefEmail"></div><div class="field"><label>Name</label><input class="input" id="lrRefName"></div><div class="field"><label>Company</label><input class="input" id="lrRefCompany"></div></div>
      </div>
      <div class="field"><label>First note (optional)</label><textarea class="textarea" id="lrNote" placeholder="What did they say?"></textarea></div>`,
    foot:`<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" id="lrSave">${icon('reply')} Log reply</button>` });
  const statusSync = ()=>{
    const s = $('#lrStatus', el).value;
    $('#lrRevisitWrap', el).hidden = s!=='Declined';
    $('#lrRefBox', el).hidden = s!=='Redirected';
    $('#lrStatusHint', el).textContent = STATUS_META[s]?.desc || '';
    if(s==='Redirected' && !$('#lrRefCompany', el).value) $('#lrRefCompany', el).value = $('#lrCompany', el).value;
  };
  $('#lrStatus', el).addEventListener('change', statusSync); statusSync();
  $$('[data-rv]', el).forEach(b=> b.addEventListener('click', ()=>{ const m = +b.dataset.rv; $('#lrRevisit', el).value = m ? addMonthsISO(m) : ''; }));
  $('#lrCamp', el).addEventListener('change', ()=>{ userPickedCampaign = true; });
  $('#lrDiff', el).addEventListener('change', e=>{ $('#lrLedgerWrap', el).hidden = !e.target.checked; lookup(); });
  el.querySelector('[data-cancel]').addEventListener('click', ()=> closeModal(el));
  const existingFor = ()=>{ const n = normEmail($('#lrEmail', el).value); return n.valid ? state.rels.find(r=>r.email_norm===n.email) : null; };
  const matchesBox = ()=>{
    const n = normEmail($('#lrEmail', el).value);
    const cand = { email_norm:n.valid?n.email:'', email_domain:n.valid?emailDomain(n.email):'', company_name:$('#lrCompany', el).value.trim(), contact_person:$('#lrName', el).value.trim() };
    cand.company_name_clean = cleanCompany(cand.company_name);
    const ms = tier1Check(cand, buildRelIndex(state.rels)).filter(m=>!m.kinds.has('email')).slice(0,3);
    $('#lrMatches', el).innerHTML = ms.length ? `<div class="notice">${icon('info')}<div><b>Related to people you already know</b>${ms.map(m=>`<p class="match-line">${m.reasons.join(' · ')} → <a href="#" data-open-rel="${m.rel.id}">${esc(relName(m.rel))}</a> ${statusPill(m.rel.status)}</p>`).join('')}</div></div>` : '';
    $$('#lrMatches [data-open-rel]', el).forEach(a=> a.addEventListener('click', e=>{ e.preventDefault(); openRelDetail(a.dataset.openRel); }));
  };
  const lookup = debounce(async ()=>{
    const raw = $('#lrEmail', el).value.trim();
    const n = normEmail(raw);
    $('#lrEmailHint', el).innerHTML = !raw ? '&nbsp;' : n.valid ? `Normalised: <code>${esc(n.email)}</code>` : '<span style="color:var(--red)">Not a valid address yet</span>';
    const ex = existingFor();
    $('#lrExisting', el).innerHTML = ex ? `<div class="notice warn">${icon('users')}<div><b>Already a relationship:</b> ${esc(relName(ex))} ${statusPill(ex.status)}<p>No new record is created — open it and change the status there.</p></div><button class="btn btn-primary btn-sm" data-open-existing style="margin-left:auto">Open record</button></div>` : '';
    $('#lrSave', el).innerHTML = ex ? `${icon('arrowR')} Open existing record` : `${icon('reply')} Log reply`;
    $('#lrExisting [data-open-existing]', el)?.addEventListener('click', ()=>{ closeModal(el); openRelDetail(ex.id); });
    matchesBox();
    const attr = $('#lrDiff', el).checked ? normEmail($('#lrLedgerEmail', el).value) : n;
    const seq = ++lookupSeq;
    ledgerInfo = null;
    if(!attr.valid || !db.hasLedger){ $('#lrLedgerInfo', el).innerHTML = (!db.hasLedger && attr.valid) ? `<p class="muted small" style="margin:-.4rem 0 .8rem">Ledger lookup needs the database connection — pick the campaign by hand.</p>` : ''; return; }
    try{
      const hits = await db.checkEmails([attr.email]);
      if(seq!==lookupSeq) return;
      const h = (hits||[])[0];
      if(h && h.send_count!=null){
        ledgerInfo = h;
        $('#lrLedgerInfo', el).innerHTML = `<div class="notice">${icon('repeat')}<div><b>In the ledger.</b> ${ledgerLine(h)}.${h.last_campaign_id && !userPickedCampaign?' Source campaign pre-filled.':''}</div></div>`;
        if(!userPickedCampaign && h.last_campaign_id && campById(h.last_campaign_id)) $('#lrCamp', el).value = h.last_campaign_id;
      } else {
        $('#lrLedgerInfo', el).innerHTML = `<p class="muted small" style="margin:-.4rem 0 .8rem">${icon('info','ic-sm')} Not in the ledger — pick a campaign, or leave it empty for an inbound reply or referral.</p>`;
      }
    }catch(e){ if(seq===lookupSeq) $('#lrLedgerInfo', el).innerHTML = `<p class="small" style="color:var(--red);margin:-.4rem 0 .8rem">Ledger lookup failed: ${esc(friendlyError(e))}</p>`; }
  }, 280);
  $('#lrEmail', el).addEventListener('input', lookup);
  $('#lrLedgerEmail', el).addEventListener('input', lookup);
  $('#lrCompany', el).addEventListener('input', debounce(matchesBox, 250));
  $('#lrName', el).addEventListener('input', debounce(matchesBox, 250));
  if(prefill.email) lookup();
  let saving = false;
  $('#lrSave', el).addEventListener('click', async ()=>{
    if(saving) return;
    const ex = existingFor();
    if(ex){ closeModal(el); openRelDetail(ex.id); return; }
    const raw = $('#lrEmail', el).value.trim(), n = normEmail(raw);
    const name = $('#lrName', el).value.trim(), company = $('#lrCompany', el).value.trim();
    if(raw && !n.valid){ toast('That email doesn’t look right.','warn'); return; }
    if(!n.valid && !name && !company){ toast('Add at least an email, a name or a company.','warn'); return; }
    const diff = $('#lrDiff', el).checked ? normEmail($('#lrLedgerEmail', el).value) : null;
    if(diff && $('#lrLedgerEmail', el).value.trim() && !diff.valid){ toast('The mailed address doesn’t look right.','warn'); return; }
    const status = $('#lrStatus', el).value;
    const payload = { email:n.valid?n.email:'', ledger_email: diff&&diff.valid ? diff.email : '', campaign_id: $('#lrCamp', el).value || null, status,
      contact_person:name, company_name:company, company_name_clean:cleanCompany(company), note: $('#lrNote', el).value.trim(),
      replied_at: $('#lrDate', el).value || todayISO(), revisit_after: status==='Declined' ? ($('#lrRevisit', el).value || null) : null };
    if(status==='Redirected'){ const ref = refPayload($('#lrRefEmail', el).value, $('#lrRefName', el).value, $('#lrRefCompany', el).value); if(ref) payload.referral = ref; }
    saving = true; $('#lrSave', el).disabled = true;
    try{
      const res = await db.logReply(payload);
      if(res.existing){ closeModal(el); await reloadRelationships(); openRelDetail(res.existing); return; }
      await reloadRelationships(); await reloadCampaigns().catch(()=>{}); invalidateStats();
      closeModal(el);
      toast(`Reply logged — ${name||company||payload.email} is now ${status}.${res.referral_id?' Referral added.':''}`, 'ok', { label:'Open', onClick:()=> openRelDetail(res.id) });
      rerender();
    }catch(e){ toastErr(e,'Could not log the reply.'); }
    finally{ saving = false; if(document.body.contains(el)) $('#lrSave', el).disabled = false; }
  });
}

/* ============================= BULK LOG (spec 5.2) ============================= */
function openBulkLog(){
  let rows = [];
  const el = openModal({ title:'Bulk log replies', eyebrow:'Promote many at once', size:'xl',
    sub:'Paste the addresses that replied, pick one status for all of them, then fix names and companies in the grid before saving.',
    body:`<div id="blStep1">
        <textarea class="textarea big" id="blPaste" placeholder="jane@acme.com&#10;Ravi Kumar <ravi@himalaya-tours.in>&#10;…" autofocus></textarea>
        <div class="field-row" style="margin-top:.9rem"><div class="field"><label>Status for all</label><select class="select" id="blStatus">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Found</label><div id="blFound" class="muted" style="padding-top:.5rem">Nothing yet.</div></div></div>
      </div><div id="blStep2" hidden></div>`,
    foot:`<span class="left muted small" id="blSum"></span><button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" id="blNext" disabled>Review ${icon('arrowR','ic-sm')}</button>` });
  el.querySelector('[data-cancel]').addEventListener('click', ()=> closeModal(el));
  const parse = ()=>{ const lines = parsePastedLines($('#blPaste', el).value).filter(([,e])=>normEmail(e).valid); const seen = new Set(); return lines.filter(([,e])=>{ const n = normEmail(e).email; if(seen.has(n)) return false; seen.add(n); return true; }); };
  $('#blPaste', el).addEventListener('input', debounce(()=>{ const p = parse(); $('#blFound', el).textContent = p.length ? plural(p.length,'address','addresses') : 'Nothing yet.'; $('#blNext', el).disabled = !p.length; }, 150));
  $('#blNext', el).addEventListener('click', async ()=>{
    if(rows.length){ return saveBulk(); }
    const status = $('#blStatus', el).value;
    const parsed = parse();
    $('#blNext', el).disabled = true;
    let ledger = new Map();
    if(db.hasLedger){
      try{ for(let i=0;i<parsed.length;i+=CHECK_BATCH){ for(const h of await db.checkEmails(parsed.slice(i,i+CHECK_BATCH).map(([,e])=>normEmail(e).email))||[]) ledger.set(h.email, h); } }
      catch(e){ toastErr(e,'Ledger lookup failed — pick campaigns by hand.'); }
    }
    rows = parsed.map(([name, e])=>{ const em = normEmail(e).email; const ex = state.rels.find(r=>r.email_norm===em); const h = ledger.get(em);
      return { email:em, contact_person:name, company_name:'', status, campaign_id: h && h.last_campaign_id && campById(h.last_campaign_id) ? h.last_campaign_id : '', ledger:h, existing:ex, include:!ex, updateExisting:false }; });
    $('#blStep1', el).hidden = true;
    const st2 = $('#blStep2', el); st2.hidden = false;
    st2.innerHTML = `<div class="table-wrap" style="max-height:52vh"><table class="tbl"><thead><tr><th class="w-check"></th><th>Email</th><th>Contact name</th><th>Company</th><th>Status</th><th>Source campaign</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-i="${i}"><td class="w-check"><input type="checkbox" data-f="include" ${r.include?'checked':''}></td>
        <td><div class="primary clip" style="max-width:220px">${esc(r.email)}</div>${r.existing?`<div class="sub"><span class="tag warn">already ${esc(r.existing.status)}</span> <label class="check small"><input type="checkbox" data-f="updateExisting"> update status</label></div>`:r.ledger?`<div class="sub">${ledgerLine(r.ledger)}</div>`:`<div class="sub">not in ledger</div>`}</td>
        <td><input class="input" data-f="contact_person" value="${esc(r.contact_person)}" ${r.existing?'disabled':''}></td>
        <td><input class="input" data-f="company_name" value="${esc(r.company_name)}" ${r.existing?'disabled':''}></td>
        <td><select class="select" data-f="status">${STATUSES.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>
        <td><select class="select" data-f="campaign_id" ${r.existing?'disabled':''}>${campaignOptions(r.campaign_id,{ none:'— None —' })}</select></td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted small" style="margin:.7rem 0 0">Existing relationships are never duplicated — tick “update status” to change theirs instead. Redirected rows get a referral prompt later from their record. Declined rows stay blocked until you set a revisit date on the record.</p>`;
    $$('#blStep2 [data-f]', el).forEach(inp=> inp.addEventListener(inp.type==='checkbox'||inp.tagName==='SELECT'?'change':'input', ()=>{ const r = rows[+inp.closest('tr').dataset.i]; r[inp.dataset.f] = inp.type==='checkbox' ? inp.checked : inp.value; if(inp.dataset.f==='updateExisting' && inp.checked){ r.include = true; inp.closest('tr').querySelector('[data-f="include"]').checked = true; } sum(); }));
    const sum = ()=>{ const a = rows.filter(r=>r.include && !r.existing).length, u = rows.filter(r=>r.include && r.existing && r.updateExisting).length; $('#blSum', el).textContent = `${fmtN(a)} new${u?` · ${fmtN(u)} status updates`:''}`; $('#blNext', el).disabled = !(a+u); };
    $('#blNext', el).innerHTML = `${icon('check')} Save all`;
    sum();
  });
  async function saveBulk(){
    const todo = rows.filter(r=> r.include && (!r.existing || r.updateExisting));
    if(!todo.length) return;
    $('#blNext', el).disabled = true;
    const p = startProgress(); p.step('save','Logging replies', plural(todo.length,'person','people'), todo.length);
    let created = 0, updated = 0, failed = 0;
    for(const r of todo){
      try{
        if(r.existing){ if(r.existing.status!==r.status){ upsertRelLocal(await db.updateRelationship(r.existing.id, { status:r.status })); updated++; } }
        else { const res = await db.logReply({ email:r.email, status:r.status, campaign_id:r.campaign_id||null, contact_person:(r.contact_person||'').trim(), company_name:(r.company_name||'').trim(), company_name_clean:cleanCompany(r.company_name), replied_at:todayISO() }); if(res.id) created++; }
      }catch(e){ console.error(e); failed++; }
      p.tick();
    }
    await reloadRelationships(); await reloadCampaigns().catch(()=>{}); invalidateStats();
    await p.finish('Done', `${fmtN(created)} logged${updated?`, ${fmtN(updated)} updated`:''}.`, 500);
    closeModal(el);
    toast(`${fmtN(created)} replies logged${updated?`, ${fmtN(updated)} statuses updated`:''}${failed?`, ${fmtN(failed)} failed`:''}.`, failed?'warn':'ok');
    rerender();
  }
}

/* ============================= RELATIONSHIPS EXPORT (spec 7.3) ============================= */
function openRelExport(){
  const pre = relUi.filter.status ? [relUi.filter.status] : STATUSES.slice();
  const el = openModal({ title:'Export relationships', eyebrow:'Spec 7.3', size:'sm',
    body:`<div class="field"><label>Statuses to include</label><div style="display:grid;gap:.45rem">${STATUSES.map(s=>`<label class="check"><input type="checkbox" value="${esc(s)}" ${pre.includes(s)?'checked':''}><span class="dot" style="--c:${STATUS_META[s].color}"></span>${s} <span class="muted small">(${fmtN(state.rels.filter(r=>r.status===s).length)})</span></label>`).join('')}</div></div>
      <div class="field"><label>Format</label>${formatSeg('relFmt')}</div>`,
    foot:`<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" data-go>${icon('download')} Export</button>` });
  wireFormatSeg(el);
  el.querySelector('[data-cancel]').addEventListener('click', ()=> closeModal(el));
  el.querySelector('[data-go]').addEventListener('click', async ()=>{
    const sts = $$('input[type=checkbox]:checked', el).map(c=>c.value);
    if(!sts.length){ toast('Pick at least one status.','warn'); return; }
    closeModal(el);
    await exportRelationships(state.rels.filter(r=>sts.includes(r.status)), sts.length===STATUSES.length ? 'All' : sts.join('+'));
  });
}
async function exportRelationships(rows, scope){
  if(!rows.length){ toast('Nothing to export.','warn'); return; }
  // Suppressed addresses never appear in any export: the row stays (it's a
  // relationship), the dead address is left out and Email Bounced says why.
  let suppressed = new Set();
  if(db.hasLedger){
    const emails = [...new Set(rows.map(r=>r.email_norm).filter(Boolean))];
    try{ for(let i=0;i<emails.length;i+=CHECK_BATCH){ for(const h of await db.checkEmails(emails.slice(i,i+CHECK_BATCH))||[]) if(h.bounced_at) suppressed.add(h.email); } }
    catch(e){ toastErr(e,'Could not check the suppression list — export stopped.'); return; }
  }
  const res = exportRows({ type:'Relationships', scope, rows, columns:[
    { label:'Company', kind:'company', get:r=>r.company_name },
    { label:'Contact Name', kind:'contact', get:r=>r.contact_person },
    { label:'Email', kind:'email', get:r=> suppressed.has(r.email_norm) ? '' : r.email },
    { label:'Status', get:r=>r.status },
    { label:'Source Campaign', get:r=>campName(r.source_campaign_id) },
    { label:'Replied At', get:r=>isoDate(r.replied_at) },
    { label:'Last Contacted', get:r=>isoDate(r.last_contacted) },
    { label:'Next Follow Up', get:r=>isoDate(r.next_follow_up) },
    { label:'Revisit After', get:r=>isoDate(r.revisit_after) },
    { label:'Email Bounced', get:r=>yesNo(r.email_bounced || suppressed.has(r.email_norm)) },
    { label:'Latest Note', get:r=>{ let t = noteText(latestNote(r.id)); for(const e of suppressed) t = t.split(e).join('[bounced address]'); return t; } },
  ]});
  toast(`Exported ${plural(res.count,'relationship')}.`);
}

const campUi = { sort:{ key:'date', dir:'desc' }, detail:{ id:null, offset:0, q:'', page:null, loading:false } };
const SENDS_PAGE = 100;
function campRates(c){ const s=+c.sent_count||0, b=+c.bounce_count||0, r=+c.reply_count||0; return { s, b, r, rr:fmtPct(r,s), br:fmtPct(b,s+b) }; }
function undoBanner(){
  const u = state.lastMarkSent;

}
function wireUndo(root){ $('[data-undo-last]', root)?.addEventListener('click', ()=> undoLastMarkSent()); }

      actions:`<button class="btn btn-ghost btn-sm" id="campExport">${icon('download')} Export table</button><button class="btn btn-ghost btn-sm" id="campMark" ${db.hasLedger?'':'disabled title="Needs the database connection"'}>${icon('send')} Mark a list as sent</button><button class="btn btn-primary btn-sm" id="campNew">${icon('plus')} New campaign</button>` })}

    <div class="grid g-4" style="margin-bottom:1rem">
      <div class="card stat reveal"><span class="mono stat-label">Campaigns</span><div class="stat-num">${fmtN(rows.length)}</div><div class="stat-sub">${fmtN(rows.filter(c=>c.status==='In Progress'||c.status==='Scheduled').length)} scheduled or running</div></div>
      <div class="card stat reveal"><span class="mono stat-label">Delivered</span><div class="stat-num">${fmtN(tot.s)}</div><div class="stat-sub">across all campaigns</div></div>
      <div class="card stat reveal"><span class="mono stat-label">Replies</span><div class="stat-num">${fmtN(tot.r)}</div><div class="stat-sub">${fmtPct(tot.r,tot.s)} reply rate</div></div>
      <div class="card stat reveal"><span class="mono stat-label">Bounced</span><div class="stat-num">${fmtN(tot.b)}</div><div class="stat-sub">${fmtPct(tot.b,tot.s+tot.b)} bounce rate</div></div>
    </div>
    ${rows.length ? `<div class="table-wrap reveal"><table class="tbl"><thead><tr>${th('name','Campaign')}${th('date','Date')}<th>Status</th>${th('sent_count','Delivered','r')}${th('bounce_count','Bounced','r')}${th('reply_count','Replies','r')}${th('rr','Reply rate','r')}${th('br','Bounce rate','r')}<th></th></tr></thead><tbody>
      ${rows.map(c=>{ const k = campRates(c); return `<tr class="clickable" data-id="${c.id}">
        <td><div class="primary clip" style="max-width:320px">${esc(c.name)}</div>${c.source_sheet?`<div class="sub clip" style="max-width:320px">${icon('file','ic-sm')} ${esc(c.source_sheet)}</div>`:''}</td>
        <td class="muted num">${fmtDate(c.date)}</td>
        <td><span class="pill" style="--c:${CAMPAIGN_STATUS_COLOR[c.status]||'var(--grey)'}">${esc(c.status||'—')}</span></td>
        <td class="r num">${fmtN(k.s)}</td><td class="r num">${fmtN(k.b)}</td><td class="r num">${fmtN(k.r)}</td>
        <td class="r"><span class="rate"><span class="num">${k.rr}</span><span class="rate-track"><span class="rate-fill" style="display:block;width:${Math.min(100,pct(k.r,k.s)*4)}%"></span></span></span></td>
        <td class="r"><span class="rate"><span class="num">${k.br}</span><span class="rate-track"><span class="rate-fill b" style="display:block;width:${Math.min(100,pct(k.b,k.s+k.b)*4)}%"></span></span></span></td>

    </tbody></table></div>`
    : `<div class="card">${emptyState({ icon:'send', title:'No campaigns yet', text:'Check a list, export it, send it from your tool, then Mark as Sent. Or create a campaign now and mark a list later.', action:`<button class="btn btn-primary" onclick="go('check')">${icon('shield')} Check a list</button>` })}</div>`}`;
  wireUndo(root);
  $$('th[data-sort]', root).forEach(t=> t.addEventListener('click', ()=>{ const k=t.dataset.sort; if(campUi.sort.key===k) campUi.sort.dir = campUi.sort.dir==='asc'?'desc':'asc'; else { campUi.sort.key=k; campUi.sort.dir = k==='name'?'asc':'desc'; } renderCampaigns(root); }));

      if(isNew){ const row = await db.insertCampaign(fields); state.campaigns.unshift(row); closeModal(el); toast('Campaign created.'); go('campaigns', row.id); }
      else { const row = await db.updateCampaign(c.id, fields); Object.assign(campById(c.id), row); closeModal(el); toast('Saved.'); rerender(); }

  $('#cdDelete').addEventListener('click', ()=> openCampaignDelete(c));
  $('#cdMark').addEventListener('click', ()=> openMarkSent({ campaignId:c.id }));
  $('#cdBounce').addEventListener('click', ()=> openBouncePurge(c));
  $('#cdExport').addEventListener('click', ()=> exportDelivered(c));

/* Spec 11: deleting a campaign asks whether to remove its sends from the
   ledger history. Default keeps the ledger, since the emails were sent. */

    body:`<p style="margin-top:0;color:var(--text-2)">The campaign, its ${plural(+c.sent_count||0,'send')} and its reply attributions will be removed. Relationships stay, with their source campaign cleared.</p>
      ${hasSends && db.hasLedger?`<div style="display:grid;gap:.5rem;margin:1rem 0">
        <label class="card" style="padding:.8rem 1rem;cursor:pointer;display:flex;gap:.7rem"><input type="radio" name="dl" value="keep" checked style="accent-color:var(--ink-deep)"><span><b>Keep the ledger as it is</b> <span class="tag">recommended</span><br><span class="muted small">The emails were really sent — they keep showing as Previously mailed.</span></span></label>
        <label class="card" style="padding:.8rem 1rem;cursor:pointer;display:flex;gap:.7rem;margin:0"><input type="radio" name="dl" value="remove" style="accent-color:var(--ink-deep)"><span><b>Also remove its sends from the ledger history</b><br><span class="muted small">Addresses only mailed in this campaign disappear from the ledger and will check as New again.</span></span></label>
      </div>`:''}
      <div class="field" style="margin:0"><label>Type <b>delete</b> to confirm</label><input class="input" id="delType" autocomplete="off"></div>`,
    foot:`<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-danger" data-go disabled>Delete campaign</button>` });
  const go_ = el.querySelector('[data-go]');
  $('#delType', el).addEventListener('input', e=>{ go_.disabled = e.target.value.trim().toLowerCase()!=='delete'; });
  el.querySelector('[data-cancel]').addEventListener('click', ()=> closeModal(el));
  go_.addEventListener('click', async ()=>{
    const remove = el.querySelector('input[name=dl]:checked')?.value==='remove';
    go_.disabled = true;
    try{
      await db.deleteCampaign(c.id, remove);
      state.campaigns = state.campaigns.filter(x=>x.id!==c.id);
      if(state.lastMarkSent?.campaignId===c.id) state.lastMarkSent = null;
      await reloadRelationships().catch(()=>{}); invalidateStats();
      closeModal(el); toast(`Deleted ${c.name}${remove?' and its ledger history':''}.`); go('campaigns');
    }catch(e){ go_.disabled = false; toastErr(e,'Delete failed.'); }
  });
}
/* 7.2 Campaign Delivered List — paged from the server, suppression excluded there. */
async function exportDelivered(c){
  const p = startProgress(); p.step('read','Collecting delivered addresses', c.name, +c.sent_count||null);
  try{
    const out = []; let offset = 0, total = null;
    for(;;){
      const pg = await db.campaignSendsPage(c.id, offset, 1000, '');
      if(total==null){ total = pg.total; p.step('read','Collecting delivered addresses', c.name, total); }
      out.push(...pg.rows); p.set(out.length);
      offset += 1000; if(offset >= pg.total || !pg.rows.length) break;
    }
    p.close();
    const res = exportRows({ type:'CampaignDelivered', scope:c.name, rows:out, columns:[
      { label:'Email', kind:'email', get:r=>r.email }, { label:'Sent Date', get:r=>isoDate(r.sent_at) },
      { label:'Replied', get:r=>yesNo(r.replied) }, { label:'Relationship Status', get:r=>r.relationship_status||'' } ]});
    toast(`Exported ${plural(res.count,'address','addresses')}.`);
  }catch(e){ p.close(); toastErr(e,'Export failed.'); }
}

/* ============================= BOUNCE PURGE (spec 6) =============================
   Paste anything; every email is pulled out, normalised and de-duplicated;
   the preview shows four groups; a backup csv is one click; the typed count
   confirms; one server transaction does the rest. campaign = null means the
   global purge from Settings (6.4). */
function openBouncePurge(campaign){
  const scopeName = campaign ? campaign.name : 'all campaigns';
  let pv = null, searchAll = false, busy = false;
  const el = openModal({ title:'Remove bounced emails', eyebrow: campaign ? esc(campaign.name) : 'Every campaign', size:'lg',
    sub: campaign ? 'Paste raw bounce notifications, a column from a sheet, a comma list — anything. Only addresses that were in this campaign are touched.' : 'The same purge, across every campaign at once.',
    body:`<div id="bpStep1"><textarea class="textarea big" id="bpPaste" placeholder="Delivery Status Notification (Failure)&#10;Address not found: jane@oldcompany.com&#10;…" autofocus></textarea>
      <p class="muted small" style="margin:.6rem 0 0" id="bpFound">Nothing pasted yet.</p></div>
      <div id="bpStep2" hidden></div>`,
    foot:`<span class="left" id="bpLeft"></span><button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" id="bpNext" disabled>Preview ${icon('arrowR','ic-sm')}</button>` });
  el.querySelector('[data-cancel]').addEventListener('click', ()=> closeModal(el));
  $('#bpPaste', el).addEventListener('input', debounce(()=>{ const r = extractEmails($('#bpPaste', el).value); $('#bpFound', el).textContent = (r.valid.length||r.invalid.length) ? `${plural(r.valid.length,'address','addresses')} found${r.invalid.length?`, ${fmtN(r.invalid.length)} that look like emails but aren’t valid`:''}${r.duplicates?`, ${fmtN(r.duplicates)} repeats collapsed`:''}.` : 'No email addresses found yet.'; $('#bpNext', el).disabled = !(r.valid.length||r.invalid.length); }, 150));
  const previewChunks = async (campId, emails)=>{
    const found = [], suppressed = [];
    for(let i=0;i<emails.length;i+=1000){ const r = await db.purgePreview(campId, emails.slice(i,i+1000)); found.push(...(r.found||[])); suppressed.push(...(r.suppressed||[])); }
    return { found, suppressed };
  };
  $('#bpNext', el).addEventListener('click', async ()=>{
    if(pv) return;
    const ex = extractEmails($('#bpPaste', el).value);
    $('#bpNext', el).disabled = true; $('#bpNext', el).innerHTML = '<span class="spin"></span> Looking…';
    try{
      const r = await previewChunks(campaign ? campaign.id : null, ex.valid);
      pv = { valid:ex.valid, invalid:ex.invalid, found:r.found, suppressed:new Set(r.suppressed), elsewhere:[] };
      renderPreview();
    }catch(e){ toastErr(e,'Preview failed.'); $('#bpNext', el).disabled = false; $('#bpNext', el).innerHTML = `Preview ${icon('arrowR','ic-sm')}`; }
  });
  const removalRows = ()=> pv.found.concat(searchAll ? pv.elsewhere : []);
  const renderPreview = ()=>{
    $('#bpStep1', el).hidden = true;
    const foundSet = new Set(pv.found.map(f=>f.email));
    const elseSet = new Set(pv.elsewhere.map(f=>f.email));
    const removing = new Set(removalRows().map(f=>f.email));
    const notFound = pv.valid.filter(e=> !foundSet.has(e) && !(searchAll && elseSet.has(e)));
    const relHits = state.rels.filter(r=> r.email_norm && removing.has(r.email_norm));
    const relElse = new Set(state.rels.filter(r=> r.email_norm && notFound.includes(r.email_norm)).map(r=>r.email_norm));
    const list = (arr, fmt)=> arr.length ? `<div class="group-list">${arr.slice(0,200).map(fmt).join('<br>')}${arr.length>200?`<br>…and ${fmtN(arr.length-200)} more`:''}</div>` : '';
    const n = removing.size;
    $('#bpStep2', el).hidden = false;
    $('#bpStep2', el).innerHTML = `
      <div class="groups">
        <div class="group" style="--c:var(--red)"><div class="group-head"><span class="group-title">${campaign?'Found in this campaign':'Found in campaigns'}</span><b>${fmtN(n)}</b></div><div class="group-desc">Will be removed. ${campaign?(searchAll&&elseSet.size?`Includes ${fmtN(elseSet.size)} found in other campaigns.`:''):'Every campaign they appear in.'}</div>${list([...foundSet].concat(searchAll?[...elseSet].filter(e=>!foundSet.has(e)):[]), e=> esc(e)+(foundSet.has(e)?'':` <span class="tag">in ${esc(pv.elsewhere.filter(f=>f.email===e).map(f=>f.campaign_name).join(', '))}</span>`))}</div>
        <div class="group" style="--c:var(--grey)"><div class="group-head"><span class="group-title">Not found — ignored</span><b>${fmtN(notFound.length)}</b></div><div class="group-desc">Usually typos, your own address, mailer-daemon, or the wrong campaign. Never deleted from anywhere.</div>${list(notFound, e=> esc(e)+(relElse.has(e)?' <span class="tag">relationship</span>':''))}
          ${campaign && (notFound.length || searchAll) ? `<label class="check wrap small" style="margin-top:.6rem"><input type="checkbox" id="bpAll" ${searchAll?'checked':''}><span>Search all campaigns for these${searchAll?` — <b>${fmtN(elseSet.size)}</b> found elsewhere, moved to the removal list`:''}</span></label>`:''}</div>
        <div class="group" style="--c:var(--st-past)"><div class="group-head"><span class="group-title">Also a relationship record</span><b>${fmtN(relHits.length)}</b></div><div class="group-desc">Flagged “email bounced” with a note — never deleted. Usually someone changed jobs.</div>${list(relHits, r=> `${esc(r.email_norm)} · ${esc(relName(r))} (${esc(r.status)})`)}</div>
        <div class="group" style="--c:var(--accent)"><div class="group-head"><span class="group-title">Invalid</span><b>${fmtN(pv.invalid.length)}</b></div><div class="group-desc">Text that looked like an email but failed validation.</div>${list(pv.invalid, e=>esc(e))}</div>
      </div>
      ${pv.suppressed.size?`<p class="muted small">${fmtN(pv.suppressed.size)} of these were already on the suppression list from an earlier bounce.</p>`:''}
      ${n?`<div class="confirm-type">
          <button class="btn btn-ghost btn-sm" id="bpBackup">${icon('download','ic-sm')} Download backup of the ${fmtN(n)}</button>
          <span style="flex:1"></span><span class="small">This is permanent. Type <b>${fmtN(n)}</b> to confirm</span><input class="input" id="bpType" inputmode="numeric" autocomplete="off">
        </div>`:`<div class="notice">${icon('info')}<div>Nothing to remove${campaign?' from this campaign':''}.</div></div>`}`;
    $('#bpAll', el)?.addEventListener('change', async e=>{
      searchAll = e.target.checked;
      if(searchAll && !pv.elsewhere.length && notFound.length){
        try{ const r = await previewChunks(null, notFound); pv.elsewhere = r.found.filter(f=> f.campaign_id!==campaign.id); }catch(err){ toastErr(err,'Search failed.'); searchAll = false; }
      }
      renderPreview();
    });
    $('#bpBackup', el)?.addEventListener('click', ()=>{
      const res = exportRows({ type:'BounceBackup', scope:scopeName, dedupe:false, sort:false, rows: removalRows().slice().sort((a,b)=> a.email.localeCompare(b.email)), columns:[
        { label:'Email', kind:'email', get:r=>r.email }, { label:'Campaign', get:r=>r.campaign_name }, { label:'Sent Date', get:r=>isoDate(r.sent_at) } ]});
      toast(`Backup saved: ${res.fileName}`);
    });
    const btn = $('#bpNext', el);
    btn.className = 'btn btn-danger'; btn.innerHTML = `${icon('trash')} Remove ${fmtN(n)} permanently`; btn.disabled = true;
    $('#bpLeft', el).innerHTML = `<button class="btn btn-quiet btn-sm" id="bpBack">${icon('chevronL','ic-sm')} Edit paste</button>`;
    $('#bpBack', el).addEventListener('click', ()=>{ pv = null; searchAll = false; $('#bpStep2', el).hidden = true; $('#bpStep1', el).hidden = false; btn.className='btn btn-primary'; btn.innerHTML=`Preview ${icon('arrowR','ic-sm')}`; btn.disabled=false; btn.onclick=null; $('#bpLeft', el).innerHTML=''; });
    $('#bpType', el)?.addEventListener('input', e=>{ btn.disabled = e.target.value.replace(/[,.\s]/g,'') !== String(n); });
    btn.onclick = async ()=>{
      if(!pv || busy || btn.disabled) return;
      busy = true; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Removing…';
      try{
        const here = [...new Set(pv.found.map(f=>f.email))];
        const all = searchAll ? [...new Set(pv.elsewhere.map(f=>f.email))] : [];
        const r = await db.purgeBounces(campaign ? campaign.id : null, here, all);
        await Promise.all([reloadCampaigns(), reloadRelationships()]).catch(()=>{});
        invalidateStats(); campUi.detail.page = null;
        closeModal(el);
        uiConfirm({ title:'Bounced emails removed', confirmLabel:'Done', alert:true, message:`<b>${plural(r.emails,'address','addresses')}</b> removed (${plural(r.removed,'send')}). They’re on the suppression list now, so they can never come back as New.${r.relationships_flagged?`<br><br>${plural(r.relationships_flagged,'relationship')} flagged “email bounced”.`:''}` });
        rerender();
      }catch(e){ toastErr(e,'Nothing was removed — the purge runs as one transaction.'); busy = false; btn.disabled = false; btn.innerHTML = `${icon('trash')} Remove ${fmtN(n)} permanently`; }
    };
  };
}

/* ============================= LEDGER (spec 1.3, 7.4, 9) =============================
   Search by one exact address only. The only thing that ever reads the whole

const ledgerUi = { q:'', result:null, error:null };
function renderLedger(root){
  root.innerHTML = `
    ${pageHead({ eyebrow:'Ledger', title:'Everyone you have ever mailed', lede:'One row per address, around 100 bytes each — no names, no companies, no notes. It is never loaded in bulk; look up one exact address to see its history.',
      actions:`<button class="btn btn-ghost btn-sm" id="ledBackup" ${db.hasLedger?'':'disabled'}>${icon('download')} Full ledger backup</button>` })}
    ${db.hasLedger?'':needsDbNotice('The ledger')}
    <div class="grid g-3" style="margin-bottom:1.2rem" id="ledStats">
      ${['Addresses in the ledger','Replied','On the suppression list'].map(t=>`<div class="card stat reveal"><span class="mono stat-label">${t}</span><div class="stat-num"><span class="skeleton" style="display:inline-block;width:90px;height:30px"></span></div><div class="stat-sub">&nbsp;</div></div>`).join('')}
    </div>
    <div class="card reveal" style="padding:1.5rem">
      <h3 style="margin-bottom:.8rem">Look up an address</h3>
      <div class="lookup-hero"><input class="input" id="ledQ" placeholder="name@company.com" value="${esc(ledgerUi.q)}" ${db.hasLedger?'':'disabled'} autocomplete="off"><button class="btn btn-primary" id="ledGo" ${db.hasLedger?'':'disabled'}>${icon('search')} Look up</button></div>
      <p class="muted small" style="margin:.5rem 0 0">Exact match after normalising — no partial search, by design.</p>
      <div id="ledResult" style="margin-top:1.2rem"></div>
    </div>`;
  const paintResult = ()=>{
    const box = $('#ledResult'); if(!box) return;
    if(ledgerUi.error){ box.innerHTML = `<div class="notice bad">${icon('alert')}<div>${esc(ledgerUi.error)}</div></div>`; return; }
    if(!ledgerUi.result){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="card card-tint">${ledgerSummaryHtml(ledgerUi.result)}</div>`;
    $$('[data-open-rel]', box).forEach(a=> a.addEventListener('click', e=>{ e.preventDefault(); openRelDetail(a.dataset.openRel); }));
  };
  paintResult();
  const look = async ()=>{
    const raw = $('#ledQ').value.trim(); ledgerUi.q = raw;
    const n = normEmail(raw);
    if(!n.valid){ ledgerUi.result = null; ledgerUi.error = raw ? 'That isn’t a valid email address.' : null; paintResult(); return; }
    $('#ledGo').disabled = true;
    try{ ledgerUi.result = await db.ledgerLookup(n.email); ledgerUi.error = null; }
    catch(e){ ledgerUi.error = friendlyError(e); ledgerUi.result = null; }
    finally{ if($('#ledGo')) $('#ledGo').disabled = false; }
    paintResult();
  };
  $('#ledGo').addEventListener('click', look);
  $('#ledQ').addEventListener('keydown', e=>{ if(e.key==='Enter') look(); });
  $('#ledBackup').addEventListener('click', exportLedgerBackup);
  if(db.hasLedger) getStats().then(s=>{
    const box = $('#ledStats'); if(!box || !s) return;
    const tiles = [[s.ledger_total,'Addresses in the ledger',`${fmtPct(s.ledger_replied, s.ledger_total)} replied`],[s.ledger_replied,'Replied','promoted to relationships'],[s.suppressed_total,'On the suppression list','never exported, never New again']];
    box.innerHTML = tiles.map(([v,t,sub],i)=>`<div class="card stat ${i===0?'card-dark':''}"><span class="mono ${i?'stat-label':''}">${t}</span><div class="stat-num">${fmtN(v)}</div><div class="stat-sub">${sub}</div></div>`).join('');
  }).catch(e=>{ const box = $('#ledStats'); if(box) box.innerHTML = `<div class="notice bad" style="grid-column:1/-1">${icon('alert')}<div>${esc(friendlyError(e))}</div></div>`; });
}
async function exportLedgerBackup(){
  if(!db.hasLedger) return;
  const p = startProgress(); p.step('read','Backing up the ledger','Paged on the server, 1,000 rows at a time.', null);
  try{
    const s = await getStats(true);
    p.step('read','Backing up the ledger','Paged on the server, 1,000 rows at a time. Suppressed addresses are left out.', s ? Math.max(1, s.ledger_total - s.suppressed_total) : null);
    const out = []; let after = null;
    for(;;){
      const page = await db.exportLedgerPage(after, 1000);
      if(!page || !page.length) break;
      out.push(...page); p.set(out.length);
      after = page[page.length-1].email;
      if(page.length < 1000) break;
      await yieldToPaint();
    }
    p.close();
    if(!out.length){ toast('The ledger is empty.','warn'); return; }
    const res = exportRows({ type:'LedgerBackup', scope:'All', rows:out, columns:[
      { label:'Email', kind:'email', get:r=>r.email }, { label:'First Sent', get:r=>isoDate(r.first_sent_at) }, { label:'Last Sent', get:r=>isoDate(r.last_sent_at) },
      { label:'Times Sent', get:r=>+r.send_count||0 }, { label:'First Campaign', get:r=>r.first_campaign||'' }, { label:'Last Campaign', get:r=>r.last_campaign||'' }, { label:'Replied', get:r=>yesNo(r.replied) } ]});
    toast(`Ledger backup saved — ${plural(res.count,'row')}.`);
  }catch(e){ p.close(); toastErr(e,'Backup failed.'); }
}

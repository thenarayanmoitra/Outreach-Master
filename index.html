        ? `<p class="small" style="margin:0 0 .8rem;color:var(--text-2)">The old <code>leads</code> table still has <b>${fmtN(s.total)}</b> rows across ${plural(s.sheets,'sheet')}. The migration moves repliers into relationships, everyone else into the sent ledger, and archives what can't enter it.</p><button class="btn btn-primary btn-sm" onclick="go('migrate')">Open the migration ${icon('arrowR','ic-sm')}</button>`
        : `<p class="muted small" style="margin:0">${icon('checkc','ic-sm')} No old leads table — nothing to migrate.</p>`;
    }).catch(e=>{ const b = $('#migCardBody'); if(b) b.innerHTML = `<p class="small" style="color:var(--red);margin:0">${esc(friendlyError(e))}</p>`; });
  }
}
async function loadSup(){
  const box = $('#supList'); if(!box) return;
  try{
    const r = await db.suppressionList(supUi.q, supUi.offset, 25);
    if(!$('#supList')) return;
    box.innerHTML = r.rows.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Address</th><th>Bounced</th><th></th></tr></thead><tbody>
        ${r.rows.map(x=>`<tr><td><div class="primary clip" style="max-width:250px">${esc(x.email)}</div>${x.campaign_name?`<div class="sub">${esc(x.campaign_name)}</div>`:''}</td><td class="muted num">${fmtDate(x.bounced_at)}</td><td class="r"><button class="btn btn-quiet btn-xs" data-unsup="${esc(x.email)}">Remove</button></td></tr>`).join('')}
      </tbody></table><div class="pager"><span>${fmtN(supUi.offset+1)}–${fmtN(Math.min(supUi.offset+25, r.total))} of ${fmtN(r.total)}</span><span class="inline"><button class="btn btn-ghost btn-sm" id="supPrev" ${supUi.offset?'':'disabled'}>${icon('chevronL','ic-sm')}</button><button class="btn btn-ghost btn-sm" id="supNext" ${supUi.offset+25<r.total?'':'disabled'}>${icon('chevronR','ic-sm')}</button></span></div></div>`
      : `<p class="muted small" style="margin:.4rem 0 0">${supUi.q?'No suppressed address matches.':'Nothing has bounced yet.'}</p>`;
    $('#supPrev', box)?.addEventListener('click', ()=>{ supUi.offset = Math.max(0, supUi.offset-25); loadSup(); });
    $('#supNext', box)?.addEventListener('click', ()=>{ supUi.offset += 25; loadSup(); });
    $$('[data-unsup]', box).forEach(b=> b.addEventListener('click', async ()=>{
      const e = b.dataset.unsup;
      if(!(await uiConfirm({ title:'Remove from suppression?', message:`<b>${esc(e)}</b> will be allowed back into checks and exports. Its old sends are not restored — the next time it appears in a sheet it will check as New.`, confirmLabel:'Remove', danger:true }))) return;
      try{ await db.suppressionRemove(e); invalidateStats(); toast('Removed from the suppression list.'); loadSup(); }catch(err){ toastErr(err,'Could not remove it.'); }
    }));
  }catch(e){ box.innerHTML = `<div class="notice bad">${icon('alert')}<div>${esc(friendlyError(e))}</div></div>`; }
}

/* ============================= MIGRATION (spec 10) =============================
   Snapshot → prepare → review Won and Dead → archive the rows that can't
   enter an email ledger → run (chunked, resumable) → confirm counts → retire.
   Progress is remembered in this browser, and every server step is
   idempotent, so closing the tab half-way just means picking up again. */
const MIG_KEY = 'reach_migration_v2';
const migUi = { status:null, review:null, decisions:{}, dropCampaigns:null, summary:null, loading:false, error:null };
function migProgress(){ return lsJson(MIG_KEY, {}); }
function migSet(k, v){ const m = migProgress(); m[k] = v; lsPut(MIG_KEY, m); }
const MIG_STEPS = [
  { key:'snapshot', label:'Snapshot' },
  { key:'prepare',  label:'Prepare' },
  { key:'review',   label:'Review Won & Dead' },
  { key:'archive',  label:'Archive' },
  { key:'run',      label:'Move data' },
  { key:'retire',   label:'Confirm & retire' },
];
function migCurrentStep(){
  const m = migProgress(), s = migUi.status;
  if(!m.snapshot) return 'snapshot';
  if(!s || !s.prepared || s.unprepared>0) return 'prepare';
  if(!m.decided) return 'review';
  if(!m.archived) return 'archive';
  if(!m.ran) return 'run';
  return 'retire';
}
async function migRefresh(){
  migUi.status = await db.migrationStatus();
  state.legacy = migUi.status && migUi.status.legacy ? migUi.status : null;
}
async function renderMigration(root){
  if(!db.hasLedger){ root.innerHTML = pageHead({ eyebrow:'Migration', title:'Move from the old leads table' }) + needsDbNotice('Migration'); return; }
  if(!migUi.status && !migUi.loading){
    migUi.loading = true;
    root.innerHTML = pageHead({ eyebrow:'Migration', title:'Move from the old leads table' }) + '<div class="skeleton" style="height:260px"></div>';
    try{ await migRefresh(); migUi.error = null; }catch(e){ migUi.error = friendlyError(e); }
    migUi.loading = false;
  }
  const s = migUi.status;
  if(migUi.error){ root.innerHTML = pageHead({ eyebrow:'Migration', title:'Move from the old leads table' }) + `<div class="notice bad">${icon('alert')}<div>${esc(migUi.error)}</div></div>`; return; }
  if(!s || !s.legacy){
    const done = migUi.summary;
    root.innerHTML = pageHead({ eyebrow:'Migration', title: done?'Migration complete':'Nothing to migrate' }) + (done ? migSummaryHtml(done, true) : `<div class="card">${emptyState({ icon:'checkc', title:'No old leads table', text:'Either the migration is finished and the old tables were retired, or this is a fresh install.', action:`<button class="btn btn-primary" onclick="go('relationships')">Go to relationships</button>` })}</div>`);
    return;
  }
  const cur = migCurrentStep();
  const ci = MIG_STEPS.findIndex(x=>x.key===cur);
  root.innerHTML = `
    ${pageHead({ eyebrow:'Migration · spec 10', title:'Move from the old leads table', lede:`${fmtN(s.total)} rows and ${fmtN(s.notes)} notes across ${plural(s.sheets,'sheet')}. Repliers become relationships, everyone else goes into the sent ledger by exact email, and sheet tabs become Legacy campaigns.` })}
    <div class="wizard">
      <div class="wiz-steps">${MIG_STEPS.map((x,i)=>`<div class="wiz-step ${i<ci?'done':i===ci?'now':''}"><i>${i<ci?'✓':i+1}</i>${x.label}</div>`).join('')}</div>
      <div id="migBody"></div>
    </div>`;
  const body = $('#migBody');
  const by = s.by_status || {};
  if(cur==='snapshot'){
    body.innerHTML = `<div class="card reveal">
      <h3 style="margin-bottom:.4rem">What happens to each old status</h3>
      <table class="map-table" style="margin:.6rem 0 1.2rem">
        <tr><td><b>Won</b> · ${fmtN(by['Won']||0)}</td><td>→</td><td>${statusPill('Active Client')} or ${statusPill('Past Client')} — you review each</td></tr>
        <tr><td><b>Warm</b> · ${fmtN(by['Warm']||0)} &nbsp; <b>In Progress</b> · ${fmtN(by['In Progress']||0)}</td><td>→</td><td>${statusPill('In Conversation')}</td></tr>
        <tr><td><b>Dead</b> · ${fmtN(by['Dead']||0)}</td><td>→</td><td>${statusPill('Declined')} — or, for ghosts you gave up on, the ledger</td></tr>
        <tr><td><b>Not Now</b> · ${fmtN(by['Not Now']||0)}</td><td>→</td><td>the sent ledger, one row per unique email; rows with no email go to a Legacy_Archive csv</td></tr>
      </table>
      <div class="notice">${icon('info')}<div><b>Step 1: snapshot.</b> Copies <code>leads</code> and <code>lead_notes</code> into timestamped tables on the server before anything moves. They are locked away from the anon key. If you are near the 500 MB free-tier cap, make your own backup first.</div></div>
      <div class="inline"><button class="btn btn-primary" id="migSnap">${icon('db')} Create snapshot</button></div></div>`;
    $('#migSnap').addEventListener('click', async ()=>{
      $('#migSnap').disabled = true;
      try{ const r = await db.migrationSnapshot(); migSet('snapshot', r); toast(`Snapshot saved as ${r.leads_table}.`); renderMigration(root); }
      catch(e){ $('#migSnap').disabled = false; toastErr(e,'Snapshot failed.'); }
    });
  } else if(cur==='prepare'){
    body.innerHTML = `<div class="card reveal"><h3 style="margin-bottom:.4rem">Prepare</h3>
      <p class="muted" style="margin:0 0 1rem">Normalises every old email with the same function Reach now uses everywhere, so duplicates collapse on the exact address. ${s.prepared?`${fmtN(s.unprepared)} rows left to prepare.`:''}</p>
      <p class="small" style="margin:0 0 1rem">Snapshot: <code>${esc(migProgress().snapshot?.leads_table||'')}</code></p>
      <button class="btn btn-primary" id="migPrep">Prepare ${fmtN(s.total)} rows</button></div>`;
    $('#migPrep').addEventListener('click', async ()=>{
      const p = startProgress(); p.step('prep','Preparing old rows','Normalising emails in chunks.', s.total);
      try{
        let done = 0;
        for(let guard=0; guard<10000; guard++){ const r = await db.migrationStep('prep', 2000); done += r.processed; p.set(Math.min(done, s.total)); if(r.done) break; }
        await migRefresh(); p.close(); renderMigration(root);
      }catch(e){ p.close(); toastErr(e,'Prepare stopped — run it again to continue.'); }
    });
  } else if(cur==='review'){
    if(!migUi.review){
      body.innerHTML = '<div class="skeleton" style="height:300px"></div>';
      try{ migUi.review = await db.migrationReviewRows(); for(const r of migUi.review) migUi.decisions[r.id] = r.decision || (r.status==='Won'?'Active Client':'Declined'); }
      catch(e){ body.innerHTML = `<div class="notice bad">${icon('alert')}<div>${esc(friendlyError(e))}</div></div>`; return; }
    }
    if(!migUi.dropCampaigns) migUi.dropCampaigns = new Set((s.old_campaigns||[]).filter(c=>c.superseded).map(c=>c.id));
    const won = migUi.review.filter(r=>r.status==='Won'), dead = migUi.review.filter(r=>r.status==='Dead');
    const opts = st => st==='Won' ? [['Active Client','Active Client'],['Past Client','Past Client']] : [['Declined','Declined'],['Do Not Contact','Do Not Contact'],['Ledger','Ghost → ledger']];
    const table = (rows, st)=> rows.length ? `<div class="table-wrap" style="max-height:48vh"><table class="tbl"><thead><tr><th>Lead</th><th>Sheet</th><th>Latest note</th><th>Becomes</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td><div class="primary clip">${esc(r.company_name||r.contact_person||r.email||'—')}</div><div class="sub clip">${esc([r.company_name?r.contact_person:'', r.email].filter(Boolean).join(' · '))}</div></td>
          <td class="muted small clip" style="max-width:140px">${esc(r.source_list||'—')}<div class="sub">${r.last_contacted?`contacted ${fmtDate(r.last_contacted)}`:''}</div></td>
          <td class="note-cell"><div>${esc(r.latest_note||'—')}</div></td>
          <td><div class="seg">${opts(st).map(([v,l])=>`<button data-dec="${r.id}" data-v="${v}" class="${migUi.decisions[r.id]===v?'active':''}">${l}</button>`).join('')}</div></td></tr>`).join('')}
      </tbody></table></div>` : `<p class="muted small">None.</p>`;
    body.innerHTML = `
      <div class="card reveal"><div class="card-head"><h3>Won · ${fmtN(won.length)}</h3><span class="inline"><button class="btn btn-ghost btn-xs" data-all="Won" data-v="Active Client">All Active</button><button class="btn btn-ghost btn-xs" data-all="Won" data-v="Past Client">All Past</button></span></div>
        <p class="muted small" style="margin:-.4rem 0 .8rem">Some of these may be past clients — they get a personal message, not a campaign, but both are always blocked.</p>${table(won,'Won')}</div>
      <div class="card reveal"><div class="card-head"><h3>Dead · ${fmtN(dead.length)}</h3><span class="inline"><button class="btn btn-ghost btn-xs" data-all="Dead" data-v="Declined">All Declined</button><button class="btn btn-ghost btn-xs" data-all="Dead" data-v="Ledger">All ghosts</button></span></div>
        <p class="muted small" style="margin:-.4rem 0 .8rem">Declined means they clearly said no. Ghosts never replied and you gave up — they belong in the ledger, not relationships.</p>${table(dead,'Dead')}</div>
      ${(s.old_campaigns||[]).length?`<div class="card reveal"><div class="card-head"><h3>Old campaign rows</h3></div>
        <p class="muted small" style="margin:-.4rem 0 .8rem">These were auto-logged per import and have no sends behind them. Each old sheet becomes a “Legacy, &lt;sheet&gt;” campaign with real sends, so the ticked ones would be duplicates.</p>
        <div style="display:grid;gap:.35rem">${s.old_campaigns.map(c=>`<label class="check"><input type="checkbox" data-dropc="${c.id}" ${migUi.dropCampaigns.has(c.id)?'checked':''}>Delete <b>${esc(c.name)}</b> <span class="muted small">${fmtDate(c.date)} · ${fmtN(c.sent_count)} logged${c.superseded?' · replaced by a Legacy campaign':''}</span></label>`).join('')}</div></div>`:''}
      <div class="inline" style="justify-content:flex-end;margin-top:1rem"><button class="btn btn-primary" id="migSaveDec">Save decisions ${icon('arrowR','ic-sm')}</button></div>`;
    $$('[data-dec]', body).forEach(b=> b.addEventListener('click', ()=>{ migUi.decisions[b.dataset.dec] = b.dataset.v; $$(`[data-dec="${b.dataset.dec}"]`, body).forEach(x=> x.classList.toggle('active', x===b)); }));
    $$('[data-all]', body).forEach(b=> b.addEventListener('click', ()=>{ migUi.review.filter(r=>r.status===b.dataset.all).forEach(r=> migUi.decisions[r.id] = b.dataset.v); renderMigration(root); }));
    $$('[data-dropc]', body).forEach(cb=> cb.addEventListener('change', ()=>{ cb.checked ? migUi.dropCampaigns.add(cb.dataset.dropc) : migUi.dropCampaigns.delete(cb.dataset.dropc); }));
    $('#migSaveDec').addEventListener('click', async ()=>{
      try{ await db.migrationSaveDecisions(migUi.decisions); migSet('decided', true); migSet('dropCampaigns', [...migUi.dropCampaigns]); await migRefresh(); toast('Decisions saved.'); renderMigration(root); }
      catch(e){ toastErr(e,'Could not save decisions.'); }
    });
  } else if(cur==='archive'){
    body.innerHTML = `<div class="card reveal"><h3 style="margin-bottom:.4rem">Archive what can’t enter the ledger</h3>
      <p class="muted" style="margin:0 0 1rem"><b>${fmtN(s.ledger_bound_noemail||0)}</b> ledger-bound rows have no valid email, so they can’t be remembered by address. They — and every note attached to a row leaving for the ledger — go into a Legacy_Archive csv for your Google Sheets, then are removed.</p>
      <div class="inline"><button class="btn btn-primary" id="migArch">${icon('download')} Download Legacy_Archive</button><button class="btn btn-ghost" id="migArchDone" ${migProgress().archiveFile?'':'disabled'}>I have it — continue ${icon('arrowR','ic-sm')}</button></div>
      ${migProgress().archiveFile?`<p class="small" style="margin:.8rem 0 0;color:var(--green)">${icon('checkc','ic-sm')} Saved ${esc(migProgress().archiveFile)}</p>`:''}</div>`;
    $('#migArch').addEventListener('click', async ()=>{
      $('#migArch').disabled = true;
      try{
        const rows = await db.migrationArchiveRows();
        const res = exportRows({ type:'LegacyArchive', scope:'All', rows, dedupe:false, sort:false, columns:[
          { label:'Sheet', get:r=>r.sheet }, { label:'Company', get:r=>r.company }, { label:'Contact Name', get:r=>r.contact }, { label:'Email', get:r=>r.email },
          { label:'Old Status', get:r=>r.status }, { label:'Date Added', get:r=>isoDate(r.date_added) }, { label:'Last Contacted', get:r=>isoDate(r.last_contacted) },
          { label:'Reason', get:r=>r.reason }, { label:'Note', get:r=>r.note||'' }, { label:'Note Date', get:r=>isoDate(r.note_date) } ]});
        migSet('archiveFile', res.fileName); migSet('archivedRows', s.ledger_bound_noemail||0);
        toast(`Archive saved — ${plural(res.count,'row')}.`); renderMigration(root);
      }catch(e){ $('#migArch').disabled = false; toastErr(e,'Archive export failed.'); }
    });
    $('#migArchDone').addEventListener('click', ()=>{ migSet('archived', true); renderMigration(root); });
  } else if(cur==='run'){
    const m = migProgress();
    const dec = migUi.decisions && Object.keys(migUi.decisions).length ? migUi.decisions : null;
    body.innerHTML = `<div class="card reveal"><h3 style="margin-bottom:.4rem">Move the data</h3>
      <ul style="color:var(--text-2);line-height:1.8;padding-left:1.1rem;margin:.4rem 0 1rem">
        <li>One <b>Legacy, &lt;sheet&gt;</b> campaign per old sheet, with matching campaign sends.</li>
        <li><b>${fmtN(s.ledger_bound_valid||0)}</b> rows with a valid email → <b>${fmtN(s.ledger_bound_emails||0)}</b> ledger addresses (${fmtN((s.ledger_bound_valid||0)-(s.ledger_bound_emails||0))} duplicates collapse, earliest date kept).</li>
        <li><b>${fmtN(s.ledger_bound_noemail||0)}</b> archived rows removed.</li>
        <li><b>${fmtN(s.stay||0)}</b> rows copied into relationships with their notes (same ids), and credited to their Legacy campaign.</li>
        ${(m.dropCampaigns||[]).length?`<li>${plural(m.dropCampaigns.length,'superseded old campaign row')} deleted.</li>`:''}
      </ul>
      <p class="muted small">Runs in small chunks so nothing times out. If it stops, press Run again — every step picks up where it left off.</p>
      <button class="btn btn-primary" id="migRun">${icon('db')} Run migration</button></div>`;
    $('#migRun').addEventListener('click', async ()=>{
      if(!migUi.review){ try{ migUi.review = await db.migrationReviewRows(); for(const r of migUi.review) migUi.decisions[r.id] = r.decision || (r.status==='Won'?'Active Client':'Declined'); }catch(e){ migUi.review = []; } }
      const before = { ...s };
      const steps = [{key:'campaigns',label:'Campaigns'},{key:'ledger',label:'Ledger'},{key:'archive_delete',label:'Archive'},{key:'relationships',label:'Relationships'},{key:'counters',label:'Counters'}];
      const p = startProgress(steps);
      try{
        p.step('campaigns','Creating Legacy campaigns','One per old sheet.', null);
        await db.migrationStep('campaigns');
        const loop = async (key, title, total, size)=>{
          p.step(key, title, 'Chunked and resumable.', total||null);
          let n = 0;
          for(let guard=0; guard<100000; guard++){ const r = await db.migrationStep(key, size); n += r.processed; if(total) p.set(Math.min(n,total)); if(r.done) break; }
        };
        await loop('ledger','Writing the sent ledger', before.ledger_bound_valid, 1000);
        await loop('archive_delete','Removing archived rows', before.ledger_bound_noemail, 2000);
        await loop('relationships','Copying relationships', before.stay, 500);
        p.step('counters','Recounting campaigns','', null);
        await db.migrationStep('counters');
        for(const id of (m.dropCampaigns||[])){ try{ await db.deleteCampaign(id, false); }catch(e){ console.warn('drop campaign', e); } }
        migSet('ran', true);
        await migRefresh();
        await loadCore(); invalidateStats();
        const moved = {}; STATUSES.forEach(x=> moved[x]=0);
        moved['In Conversation'] = (before.by_status?.['Warm']||0) + (before.by_status?.['In Progress']||0);
        for(const r of (migUi.review||[])){ const d = migUi.decisions[r.id] || (r.status==='Won'?'Active Client':'Declined'); if(d!=='Ledger') moved[d] = (moved[d]||0)+1; }
        migUi.summary = { moved, toLedgerRows: before.ledger_bound_valid||0, ledgerEmails: before.ledger_bound_emails||0, collapsed:(before.ledger_bound_valid||0)-(before.ledger_bound_emails||0), archived: before.ledger_bound_noemail||0, left: migUi.status?.total, copied: migUi.status?.copied, archiveFile: m.archiveFile };
        migSet('summary', migUi.summary);
        await p.finish('Data moved', 'Check the counts, then retire the old tables.', 700);
        renderSide(); renderMigration(root);
      }catch(e){ p.close(); toastErr(e,'Migration paused — press Run again to continue from where it stopped.'); }
    });
  } else {
    const sum = migUi.summary || migProgress().summary || { moved:{}, left:s.total, copied:s.copied };
    sum.left = s.total; sum.copied = s.copied;
    const match = s.total===s.copied;
    body.innerHTML = migSummaryHtml(sum, false) + `<div class="card reveal">
      <h3 style="margin-bottom:.4rem">Confirm the counts</h3>
      <p class="muted" style="margin:0 0 1rem">Rows left in the old table: <b>${fmtN(s.total)}</b> · copied into relationships: <b>${fmtN(s.copied)}</b>. ${match?'<span style="color:var(--green);font-weight:700">They match.</span>':'<span style="color:var(--red);font-weight:700">They don’t match yet — run the move again.</span>'}</p>
      ${match?`<p class="small muted">Retiring renames <code>leads</code> and <code>lead_notes</code> to <code>*_retired_${stamp()}</code> and removes their public access. Nothing is dropped; your snapshot stays too.</p><button class="btn btn-primary" id="migRetire">${icon('check')} Counts match — retire the old tables</button>`
        :`<button class="btn btn-ghost" id="migRerun">Run the move again</button>`}</div>`;
    $('#migRetire')?.addEventListener('click', async ()=>{
      if(!(await uiConfirm({ title:'Retire the old tables?', message:'The old leads and lead_notes tables are renamed, not deleted. Reach stops reading them.', confirmLabel:'Retire' }))) return;
      try{ const r = await db.migrationRetire(); migSet('retired', r); migUi.summary = { ...sum, retired:r }; state.legacy = null; migUi.status = { legacy:false }; renderBanners(); toast('Old tables retired.'); renderMigration(root); }
      catch(e){ toastErr(e,'Could not retire.'); }
    });
    $('#migRerun')?.addEventListener('click', ()=>{ migSet('ran', false); renderMigration(root); });
  }
}
function migSummaryHtml(sum, final){
  const moved = sum.moved || {};
  const total = Object.values(moved).reduce((a,b)=>a+b,0);
  return `<div class="card reveal ${final?'':''}">
    <div class="card-head"><h3>${final?'Everything moved':'Migration summary'}</h3>${sum.retired?`<span class="tag">retired as ${esc(sum.retired.leads_table||'')}</span>`:''}</div>
    <div class="grid g-4" style="gap:.8rem;margin-bottom:1rem">
      <div class="stat-mini"><span class="mono muted">To relationships</span><b>${fmtN(total)}</b></div>
      <div class="stat-mini"><span class="mono muted">Rows to ledger</span><b>${fmtN(sum.toLedgerRows||0)}</b></div>
      <div class="stat-mini"><span class="mono muted">Duplicates collapsed</span><b>${fmtN(sum.collapsed||0)}</b></div>
      <div class="stat-mini"><span class="mono muted">Archived</span><b>${fmtN(sum.archived||0)}</b></div>
    </div>
    <div class="hbars">${STATUSES.filter(x=>moved[x]).map(x=>`<div class="hbar-row" style="cursor:default"><span class="hbar-name"><span class="dot" style="--c:${STATUS_META[x].color}"></span>${x}</span><span class="hbar-track"><span class="hbar-fill" style="display:block;--c:${STATUS_META[x].color};width:${moved[x]/Math.max(1,total)*100}%"></span></span><span class="hbar-val">${fmtN(moved[x])}</span></div>`).join('')}</div>
    ${sum.archiveFile?`<p class="muted small" style="margin:1rem 0 0">Archive: ${esc(sum.archiveFile)}</p>`:''}
    <p class="muted small" style="margin:.4rem 0 0">Sheet tabs are now status filters in Relationships; list-level history lives in Campaigns.</p>
    ${final?`<div class="inline" style="margin-top:1rem"><button class="btn btn-primary" onclick="go('relationships')">Open relationships</button><button class="btn btn-ghost" onclick="go('campaigns')">Legacy campaigns</button></div>`:''}
  </div>`;
}
</script>
</body>
